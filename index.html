/* ============================ Leitor de PDF ============================
   Mostra as páginas na largura da tela, com zoom, tela cheia e retomada
   da leitura. Só as páginas perto da tela ficam desenhadas (economiza memória). */
const ZOOMS = [1, 1.25, 1.5, 2, 2.5, 3];
async function montarLeitor(box, src, m) {
  const chave = 'agora-pg-' + m.id;
  box.innerHTML = `<div class="leitor" id="leitor">
    <div class="lt-bar">
      <button class="icon-btn" data-a="fechar" aria-label="Sair da tela cheia">${ic('back', 20)}</button>
      <span class="lt-pg" aria-live="polite">Página <b id="lt-n">1</b> de <span id="lt-t">…</span></span>
      <div class="lt-zoom"><button data-a="menos" aria-label="Diminuir zoom">−</button><span id="lt-z">Ajustado</span><button data-a="mais" aria-label="Aumentar zoom">+</button></div>
      <button class="icon-btn" data-a="cheia" aria-label="Ler em tela cheia" title="Tela cheia">${ic('expand', 19)}</button>
    </div>
    <div class="lt-pages" id="lt-pages"><div class="loading" style="color:#dfe3ea;width:100%">Abrindo o PDF…</div></div>
  </div>`;
  const L = $('#leitor', box), cont = $('#lt-pages', box);
  let doc;
  try { const pdfjs = await carregarPdfJs(); doc = await pdfjs.getDocument({ url: src, isEvalSupported: false }).promise; }
  catch (e) {
    console.warn('Leitor indisponível; usando o visualizador do navegador.', e);
    cont.innerHTML = `<div class="loading" style="color:#dfe3ea;width:100%;text-align:center;padding:40px 20px">Não foi possível abrir o leitor agora. Verifique a conexão e recarregue a página.</div>`;
    return;
  }
  const n = doc.numPages; $('#lt-t', box).textContent = n;
  let zi = 0, ratio = 1.414, atual = 1;
  const p1 = await doc.getPage(1); { const v = p1.getViewport({ scale: 1 }); ratio = v.height / v.width; }
  const razoes = new Map([[1, ratio]]);
  const largura = () => Math.min(cont.clientWidth - (isMobile() ? 12 : 20), isMobile() ? 9999 : 920) * ZOOMS[zi];
  cont.innerHTML = Array.from({ length: n }, (_, i) => `<div class="lt-page" data-i="${i + 1}"><span class="lt-ph">${i + 1}</span></div>`).join('');
  const pags = $$('.lt-page', cont);
  const desenhadas = new Map(); // página -> tarefa
  const dimensionar = () => { const w = largura(); pags.forEach(el => { const r = razoes.get(+el.dataset.i) || ratio; el.style.width = w + 'px'; el.style.height = Math.round(w * r) + 'px'; }); };
  const apagar = i => { const el = pags[i - 1], cv = el.querySelector('canvas'); if (cv) { cv.width = 0; cv.height = 0; cv.remove(); } desenhadas.delete(i); };
  async function desenhar(i) {
    if (desenhadas.has(i)) return;
    const el = pags[i - 1], w = largura(); desenhadas.set(i, w);
    try {
      const pg = i === 1 ? p1 : await doc.getPage(i), v1 = pg.getViewport({ scale: 1 });
      if (!razoes.has(i)) { razoes.set(i, v1.height / v1.width); el.style.height = Math.round(w * v1.height / v1.width) + 'px'; }
      const dpr = Math.min(window.devicePixelRatio || 1, 2), vp = pg.getViewport({ scale: (w / v1.width) * dpr });
      const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      if (desenhadas.get(i) !== w) return; // zoom mudou durante o desenho
      el.querySelector('canvas')?.remove(); el.appendChild(cv);
      // mantém no máximo 8 páginas desenhadas: libera as mais distantes
      if (desenhadas.size > 8) [...desenhadas.keys()].sort((a, b) => Math.abs(b - atual) - Math.abs(a - atual)).slice(0, desenhadas.size - 8).forEach(apagar);
    } catch (e) { desenhadas.delete(i); console.warn(e); }
  }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) desenhar(+e.target.dataset.i); }), { root: cont, rootMargin: '800px 0px' });
  dimensionar(); pags.forEach(el => io.observe(el));
  const paginaAtual = () => { const y = cont.scrollTop + cont.clientHeight / 3; let k = 1; for (const el of pags) { if (el.offsetTop <= y) k = +el.dataset.i; else break; } return k; };
  let tSalva;
  cont.addEventListener('scroll', () => {
    const k = paginaAtual(); if (k !== atual) { atual = k; $('#lt-n', box).textContent = k; clearTimeout(tSalva); tSalva = setTimeout(() => lsSet(chave, String(k)), 400); }
    const r = $('.lt-retomar', L); if (r && cont.scrollTop > 40) r.remove();
  }, { passive: true });
  const irPara = k => { const el = pags[k - 1]; if (el) cont.scrollTop = el.offsetTop - 8; };
  const zoom = d => {
    const ni = Math.max(0, Math.min(ZOOMS.length - 1, zi + d)); if (ni === zi) return;
    const frac = cont.scrollTop / Math.max(1, cont.scrollHeight), fx = cont.scrollLeft / Math.max(1, cont.scrollWidth);
    zi = ni; [...desenhadas.keys()].forEach(apagar); dimensionar();
    cont.scrollTop = frac * cont.scrollHeight; cont.scrollLeft = fx * cont.scrollWidth;
    $('#lt-z', box).textContent = zi === 0 ? 'Ajustado' : Math.round(ZOOMS[zi] * 100) + '%';
    $('[data-a=menos]', box).disabled = zi === 0; $('[data-a=mais]', box).disabled = zi === ZOOMS.length - 1;
    pags.forEach(el => { io.unobserve(el); io.observe(el); });
  };
  $('[data-a=menos]', box).disabled = true;
  const cheia = on => {
    L.classList.toggle('cheio', on); document.body.style.overflow = on ? 'hidden' : '';
    const b = $('[data-a=cheia]', box); b.innerHTML = ic(on ? 'shrink' : 'expand', 19); b.setAttribute('aria-label', on ? 'Sair da tela cheia' : 'Ler em tela cheia');
    const k = atual; requestAnimationFrame(() => { [...desenhadas.keys()].forEach(apagar); dimensionar(); irPara(k); pags.forEach(el => { io.unobserve(el); io.observe(el); }); });
  };
  L.addEventListener('click', async e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    if (a === 'mais') zoom(1); if (a === 'menos') zoom(-1);
    if (a === 'cheia') cheia(!L.classList.contains('cheio')); if (a === 'fechar') cheia(false);
  });
  L.addEventListener('contextmenu', e => e.preventDefault());
  L.addEventListener('dragstart', e => e.preventDefault());
  const esc_ = e => {
    if (e.key === 'Escape' && L.classList.contains('cheio')) cheia(false);
    if ((e.ctrlKey || e.metaKey) && /^[sp]$/i.test(e.key)) { e.preventDefault(); toast('Este material pode ser lido apenas no portal.'); }
  };
  document.addEventListener('keydown', esc_);
  let tRes; const onRes = () => { clearTimeout(tRes); tRes = setTimeout(() => { const k = atual; [...desenhadas.keys()].forEach(apagar); dimensionar(); irPara(k); pags.forEach(el => { io.unobserve(el); io.observe(el); }); }, 200); };
  window.addEventListener('resize', onRes);
  S.limpar.push(() => { io.disconnect(); document.removeEventListener('keydown', esc_); window.removeEventListener('resize', onRes); document.body.style.overflow = ''; try { doc.destroy(); } catch {} });
  const salva = Number(lsGet(chave)) || 0;
  if (salva > 1 && salva <= n) {
    const r = document.createElement('button'); r.className = 'lt-retomar'; r.textContent = `Continuar da página ${salva}`;
    r.onclick = () => { irPara(salva); r.remove(); }; L.appendChild(r); setTimeout(() => r.remove(), 9000);
  }
}


/* ======================= Atividade dos alunos (análises) =======================
   Cada aluno acumula o próprio uso no aparelho e envia no máximo a cada 10 min,
   gravando no próprio cadastro (sem conflito com outros alunos e poupando o
   limite de gravações do GitHub). */
const hojeISO = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const kAtv = () => 'agora-atv-' + S.user?.id, kEnvio = () => 'agora-atvf-' + S.user?.id;
function mesclarAtv(a, p) {
  a = JSON.parse(JSON.stringify(a || {})); p = p || {};
  for (const k of ['dias', 'views', 'downloads', 'pubs', 'disp', 'cols']) { a[k] = a[k] || {}; for (const [x, n] of Object.entries(p[k] || {})) a[k][x] = (a[k][x] || 0) + n; }
  a.sessoes = (a.sessoes || 0) + (p.sessoes || 0);
  a.ultimo = Math.max(a.ultimo || 0, p.ultimo || 0) || undefined;
  a.primeiro = Math.min(...[a.primeiro, p.primeiro].filter(Boolean)) || undefined;
  const corte = hojeISO(new Date(Date.now() - 180 * DAY));
  for (const d of Object.keys(a.dias)) if (d < corte) delete a.dias[d];
  return JSON.parse(JSON.stringify(a));
}
function registrar(tipo, id) {
  if (!S.user || S.user.role === 'admin') return;
  let p; try { p = JSON.parse(lsGet(kAtv()) || '{}'); } catch { p = {}; }
  const d = hojeISO(), add = (k, x) => { p[k] = p[k] || {}; p[k][x] = (p[k][x] || 0) + 1; };
  p.dias = p.dias || {}; p.dias[d] = p.dias[d] || 0;
  if (tipo === 'sessao') { p.sessoes = (p.sessoes || 0) + 1; p.dias[d]++; add('disp', isStandalone() ? 'app' : isMobile() ? 'celular' : 'computador'); }
  if (tipo === 'view') add('views', id);
  if (tipo === 'download') add('downloads', id);
  if (tipo === 'pub') add('pubs', id);
  if (tipo === 'col') add('cols', id);
  p.ultimo = Date.now(); p.primeiro = p.primeiro || Date.now();
  lsSet(kAtv(), JSON.stringify(p));
  agendarEnvio();
}
let tEnvio = null, enviando = false;
function agendarEnvio(ja = false) {
  clearTimeout(tEnvio);
  const ult = Number(lsGet(kEnvio())) || 0;
  tEnvio = setTimeout(enviarAtividade, ja ? 0 : Math.max(4000, 10 * 60000 - (Date.now() - ult)));
}
async function enviarAtividade() {
  if (enviando || !S.user || S.user.role === 'admin') return;
  const raw = lsGet(kAtv()); if (!raw || raw === '{}') return;
  enviando = true; const id = S.user.id, p = JSON.parse(raw);
  lsSet(kAtv(), '{}');
  try {
    const u = await store.getUser(id);
    await store.updateUser(id, { atividade: mesclarAtv(u?.atividade, p) });
    lsSet(kEnvio(), String(Date.now()));
  } catch (e) {
    console.warn('atividade não enviada', e);
    let cur = {}; try { cur = JSON.parse(lsGet(kAtv()) || '{}'); } catch {}
    lsSet(kAtv(), JSON.stringify(mesclarAtv(cur, p)));
  } finally { enviando = false; }
}
document.addEventListener('visibilitychange', () => {

/* ======================= Quiz: inteligência artificial (Claude) =======================
   A chave da API fica SOMENTE no navegador do administrador (nunca vai para o Gist).
   O administrador gera um banco de questões por material; o aluno faz quizzes
   sorteados desse banco. */
const IA_MODELOS = [
  ['claude-sonnet-5-5', 'Claude Sonnet 5.5 (recomendado: qualidade e custo equilibrados)'],
  ['claude-opus-5-5', 'Claude Opus 5.5 (máxima qualidade, mais caro)'],
  ['claude-haiku-5-5', 'Claude Haiku 5.5 (mais barato e rápido)']
];
const iaChave = () => lsGet('agora-ia-key') || '';
const iaModelo = () => lsGet('agora-ia-modelo') || 'claude-sonnet-5-5';
async function chamarClaude({ system, content, maxTokens = 8000 }) {
  const key = iaChave();
  if (!key) throw new Error('Cadastre a chave da API do Claude em Painel → Configurações.');
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: iaModelo(), max_tokens: maxTokens, system, messages: [{ role: 'user', content }] })
    });
  } catch { throw new Error('Sem conexão com a API do Claude. Verifique sua internet.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = j?.error?.message || '';
    throw new Error(r.status === 401 ? 'Chave da API do Claude inválida. Confira em Configurações.'
      : r.status === 403 ? 'A chave não tem permissão para usar este modelo.'
      : r.status === 429 ? 'Limite de uso da API atingido. Aguarde um minuto e tente de novo.'
      : r.status === 529 || r.status >= 500 ? 'A API do Claude está sobrecarregada. Tente de novo em instantes.'
      : r.status === 400 && /credit|balance/i.test(m) ? 'Sua conta da Anthropic está sem créditos. Adicione créditos no Console da Anthropic.'
      : 'A API do Claude recusou o pedido: ' + (m || 'erro ' + r.status));
  }
  return { texto: (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n'), uso: j.usage || {}, parada: j.stop_reason };
}
/* Lê o PDF inteiro como texto, com marcação de páginas */

  let out = '';
  try {

const PROMPT_SISTEMA = `Você é professor de Direito em uma faculdade brasileira e examinador experiente de provas da OAB e de concursos jurídicos. Elabora questões de múltipla escolha de nível acadêmico, rigorosas e corretas, em português do Brasil.`;
function promptQuestoes(n, nivel, evitar) {
  return `Elabore ${n} questões de múltipla escolha baseadas EXCLUSIVAMENTE no material acima.

Regras:
- Nível: ${nivel === 'oab' ? 'Exame da OAB e concursos jurídicos' : nivel === 'graduacao' ? 'graduação em Direito' : 'misto (graduação, OAB e concursos)'}. Distribua as dificuldades (fácil, média e difícil), com predominância de média.
- Cubra o material inteiro, do início ao fim, priorizando conceitos centrais, requisitos legais, distinções, exceções e aplicação a casos concretos. Prefira questões de análise e aplicação a questões de pura memorização.
- Cada questão tem 5 alternativas (A a E) e exatamente UMA correta. As incorretas devem ser plausíveis e tecnicamente erradas por um motivo identificável.
- Não use "todas as anteriores", "nenhuma das anteriores" nem pegadinhas de redação. Não repita a mesma ideia em duas questões.
- A explicação deve dizer por que a correta está certa e por que as principais erradas estão erradas, com base no material (cite artigos de lei apenas se aparecerem no material).
- "referencia" indica onde o assunto está no material (ex.: "p. 12" ou "p. 12-13, seção 3").
${evitar.length ? `- NÃO repita estes temas já usados em questões anteriores:\n${evitar.map(t => '  • ' + t).join('\n')}\n` : ''}
Responda SOMENTE com um array JSON válido, sem texto antes ou depois, neste formato:
[{"enunciado":"...","alternativas":["...","...","...","...","..."],"correta":0,"explicacao":"...","referencia":"p. 0","dificuldade":"fácil|média|difícil","tema":"tema curto"}]
"correta" é o índice (0 a 4) da alternativa certa.`;
}
function validarQuestoes(txt) {
  let s = String(txt || '').replace(/```(?:json)?/g, '');
  const a = s.indexOf('['), b = s.lastIndexOf(']');
  if (a < 0 || b <= a) throw new Error('A IA não devolveu questões no formato esperado. Tente de novo.');
  let arr; try { arr = JSON.parse(s.slice(a, b + 1)); } catch { throw new Error('Não consegui entender a resposta da IA. Tente de novo.'); }
  return arr.filter(q => q && typeof q.enunciado === 'string' && q.enunciado.trim().length >= 15 && Array.isArray(q.alternativas) && q.alternativas.length >= 4 && q.alternativas.length <= 5 && q.alternativas.every(x => typeof x === 'string' && x.trim()) && Number.isInteger(q.correta) && q.correta >= 0 && q.correta < q.alternativas.length)
    .map(q => ({ id: uid().slice(0, 8), enunciado: q.enunciado.trim(), alternativas: q.alternativas.map(x => x.trim().replace(/^[A-Ea-e][).]\s+/, '')), correta: q.correta, explicacao: String(q.explicacao || '').trim(), referencia: String(q.referencia || '').trim(), dificuldade: String(q.dificuldade || '').trim(), tema: String(q.tema || '').trim(), origem: 'ia' }));
}
async function gerarQuestoesIA(blob, m, { total = 20, nivel = 'misto', existentes = [], onStatus } = {}) {
  let mat;
  try { mat = await textoCompletoPDF(blob, onStatus); } catch (e) { console.warn(e); mat = { texto: '', paginas: m.paginas || 0 }; }
  const cab = `Material: "${m.titulo}"${m.autor ? `, de ${m.autor}` : ''}${m.disciplina ? `. Disciplina: ${m.disciplina}` : ''}.`;
  let bloco;
  if (mat.texto.replace(/\[Página \d+\]/g, '').trim().length >= Math.max(400, mat.paginas * 60)) {
    bloco = { type: 'text', text: `${cab}\n<material>\n${mat.texto}\n</material>`, cache_control: { type: 'ephemeral' } };
  } else {
    if (blob.size > 30 * 1024 * 1024) throw new Error('Este PDF parece escaneado (sem texto) e é grande demais para a IA ler como imagem. Use uma versão do PDF com texto.');
    onStatus?.('O PDF parece escaneado: enviando as páginas como imagem para a IA ler…');
    const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
    bloco = { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: b64 }, title: m.titulo, context: cab, cache_control: { type: 'ephemeral' } };
  }
  const novas = [], uso = { entrada: 0, saida: 0 };
  const temas = existentes.map(q => q.tema || q.enunciado.slice(0, 80));
  for (let feitas = 0, lote = 1; feitas < total; lote++) {
    const n = Math.min(10, total - feitas);
    onStatus?.(`A IA está elaborando as questões ${feitas + 1} a ${feitas + n} de ${total}… (pode levar até 1 minuto)`);
    const r = await chamarClaude({ system: PROMPT_SISTEMA, maxTokens: 12000, content: [bloco, { type: 'text', text: promptQuestoes(n, nivel, [...temas, ...novas.map(q => q.tema || q.enunciado.slice(0, 80))]) }] });
    uso.entrada += (r.uso.input_tokens || 0) + (r.uso.cache_read_input_tokens || 0) + (r.uso.cache_creation_input_tokens || 0); uso.saida += r.uso.output_tokens || 0;
    const qs = validarQuestoes(r.texto);
    if (!qs.length) throw new Error('A IA não gerou questões válidas neste lote. Tente de novo.');
    novas.push(...qs.slice(0, n)); feitas += Math.min(n, qs.length);
    if (lote > Math.ceil(total / 10) + 2) break;
  }
  return { questoes: novas, uso, paginas: mat.paginas };
}

/* ============================ Banco de questões ============================ */
async function carregarBanco(m) {
  if (!m.quiz?.ref) return [];
  const u = await store.fileURL(m.quiz.ref, 'application/json');
  return JSON.parse(await (await fetch(u)).text()).questoes || [];
}
async function salvarBanco(m, questoes) {
  const blob = new Blob([JSON.stringify({ material: m.id, titulo: m.titulo, questoes })], { type: 'application/json' });
  const ref = questoes.length ? await store.uploadFile(new File([blob], 'quiz.json', { type: 'application/json' })) : '';
  const antigo = m.quiz?.ref;
  const atual = await store.get('materiais', m.id) || m;
  const novo = { ...atual, quiz: questoes.length ? { ref, total: questoes.length, geradoEm: Date.now() } : null };
  await store.save('materiais', novo);
  if (antigo) await store.deleteFile(antigo);
  return novo;
}
async function blobDoMaterial(m) {
  if (!m.fileRef) return null;
  const u = await store.fileURL(m.fileRef, 'application/pdf');
  return await (await fetch(u)).blob();
}

function promptBancoHTML({ titulo = '', disciplina = '', n = 20, nivel = 'misto' } = {}) {
  const nv = nivel === 'oab' ? 'Exame da OAB e concursos jurídicos' : nivel === 'graduacao' ? 'graduação em Direito' : 'misto (graduação, OAB e concursos jurídicos)';

Leia INTEGRALMENTE o PDF anexado${titulo ? ` ("${titulo}")` : ''}${disciplina ? `, da disciplina ${disciplina}` : ''}, do início ao fim, e elabore ${n} questões de múltipla escolha de nível acadêmico baseadas EXCLUSIVAMENTE nesse material.

2. Cubra o material inteiro (início, meio e fim), priorizando conceitos centrais, requisitos legais, distinções, exceções, prazos e aplicação a casos concretos. Prefira questões de análise e aplicação a questões de pura memorização.
3. Cada questão tem exatamente 5 alternativas (A a E) e exatamente UMA correta. As incorretas devem ser plausíveis e tecnicamente erradas por um motivo identificável.
4. Varie a posição da alternativa correta (não concentre em uma letra).
5. Não use "todas as anteriores", "nenhuma das anteriores", nem pegadinhas de redação. Não repita a mesma ideia em duas questões.
6. A explicação diz por que a correta está certa e por que as principais erradas estão erradas, com base no material. Cite artigos de lei somente se aparecerem no material.
7. Indique onde o assunto está no material (ex.: "p. 12" ou "p. 12-13").

FORMATO DA RESPOSTA (obrigatório)
Entregue SOMENTE um documento HTML completo, sem nenhum texto antes ou depois, exatamente nesta estrutura (pode ser como arquivo .html para download):

      <li>Alternativa A</li>
      <li data-correta="true">Alternativa B (a correta leva data-correta="true")</li>
      <li>Alternativa C</li>
      <li>Alternativa D</li>
      <li>Alternativa E</li>
    </ol>
    <p class="explicacao">Explicação da resposta com base no material.</p>
  </article>

</section>
</body>
</html>

Regras do HTML:
- Exatamente um <li data-correta="true"> por questão.
- Não escreva a letra (A, B, C...) dentro do texto das alternativas; a lista já numera.
- data-dificuldade deve ser "fácil", "média" ou "difícil".
- Use apenas texto simples dentro das tags (sem CSS, scripts ou imagens) e escape os caracteres < > & quando aparecerem no texto.
- Gere todas as ${n} questões; não resuma nem pare no meio.`;
}
function parseBancoHTML(texto) {
  let html = String(texto || '');
  const f = html.match(/```(?:html)?\s*([\s\S]*?)```/i); if (f && /<article|<ol/i.test(f[1])) html = f[1];
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let arts = [...doc.querySelectorAll('article.questao, .questao')];
  if (!arts.length) arts = [...doc.querySelectorAll('article')];
  const limpa = t => String(t || '').replace(/\s+/g, ' ').trim();
  const questoes = [], ignoradas = [];
  arts.forEach((a, i) => {
    const num = i + 1;
    const en = limpa((a.querySelector('.enunciado') || a.querySelector('p'))?.textContent);
    const lis = [...(a.querySelector('.alternativas') || a.querySelector('ol, ul') || a).querySelectorAll('li')];
    const alternativas = lis.map(li => limpa(li.textContent).replace(/^\(?[A-Ea-e][).:\-–]\s+/, ''));
    let corretas = lis.map((li, k) => (li.dataset.correta === 'true' || li.hasAttribute('data-correta') && li.dataset.correta !== 'false' || li.classList.contains('correta')) ? k : -1).filter(k => k >= 0);
    if (!corretas.length && a.dataset.resposta) { const k = 'ABCDE'.indexOf(a.dataset.resposta.trim().toUpperCase()[0]); if (k >= 0) corretas = [k]; }
    if (en.length < 15) return ignoradas.push(`Questão ${num}: enunciado vazio ou curto demais`);
    if (alternativas.length < 4 || alternativas.length > 5 || alternativas.some(x => !x)) return ignoradas.push(`Questão ${num}: precisa de 4 ou 5 alternativas preenchidas (tem ${alternativas.length})`);
    if (corretas.length !== 1) return ignoradas.push(`Questão ${num}: ${corretas.length ? 'mais de uma' : 'nenhuma'} alternativa marcada como correta`);
    questoes.push({ id: uid().slice(0, 8), enunciado: en, alternativas, correta: corretas[0], explicacao: limpa(a.querySelector('.explicacao')?.textContent), referencia: limpa(a.dataset.referencia), dificuldade: limpa(a.dataset.dificuldade), tema: limpa(a.dataset.tema), origem: 'importada' });
  });
  const sec = doc.querySelector('.banco-questoes');
  return { questoes, ignoradas, total: arts.length, material: sec?.dataset.material || '', disciplina: sec?.dataset.disciplina || '' };
}

/* ============================ Certificado (PDF) ============================ */
function pdfDeJPEG(jpeg, wPx, hPx, titulo) {
  const enc = new TextEncoder(), partes = [], off = []; let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; partes.push(b); len += b.length; };
  const obj = (n, f) => { off[n] = len; push(`${n} 0 obj\n`); f(); push('\nendobj\n'); };
  const W = 841.89, H = 595.28, ascii = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7e]/g, '').replace(/[()\\]/g, '');
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4, () => { push(`<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`); push(jpeg); push('\nendstream'); });
  const cmd = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(5, () => push(`<< /Length ${cmd.length} >>\nstream\n${cmd}\nendstream`));
  obj(6, () => push(`<< /Title (${ascii(titulo)}) /Producer (Instituto Agora de Estudos Juridicos) >>`));
  const x = len;
  push(`xref\n0 7\n0000000000 65535 f \n${[1, 2, 3, 4, 5, 6].map(n => String(off[n]).padStart(10, '0') + ' 00000 n \n').join('')}trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${x}\n%%EOF`);
  return new Blob(partes, { type: 'application/pdf' });
}

/* ===== Certificados: guardados SOMENTE neste aparelho (IndexedDB), nunca na nuvem ===== */
const CertDB = (() => {
  let p;
  const db = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('agora-certificados', 1);
    r.onupgradeneeded = () => { const st = r.result.createObjectStore('certs', { keyPath: 'id' }); st.createIndex('uid', 'uid'); };
    r.onsuccess = () => res(r.result); r.onerror = () => { p = null; rej(r.error); };
  }));
  const tx = async (modo, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('certs', modo); const rq = fn(t.objectStore('certs')); t.oncomplete = () => res(rq?.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Sem espaço no aparelho.')); }); };
  return { put: c => tx('readwrite', s => s.put(c)), get: id => tx('readonly', s => s.get(id)), doUsuario: uid => tx('readonly', s => s.index('uid').getAll(uid)) };
})();
const aparelhoId = () => { let a = lsGet('agora-aparelho'); if (!a) { a = uid().slice(0, 12); lsSet('agora-aparelho', a); } return a; };
const nomeCert = c => `Certificado - ${c.disciplina} - ${c.nome}`.replace(/[\\/:*?"<>|]/g, '');
/* Assinatura (impressão digital) dos dados da instituição que aparecem no certificado */
/* Aumente este número sempre que mudar o desenho do certificado: os já emitidos serão refeitos. */
const CERT_LAYOUT = 3;
function assinaturaInst() {
  const i = inst(), t = JSON.stringify([CERT_LAYOUT, i.nome, i.sigla, i.lema, i.fundacao, i.responsavel, i.cargo, i.cidade, i.cnpj, i.notaLegal, i.assinaturaTipo, i.assinatura, S.config.nomePortal]);
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let k = 0; k < t.length; k++) { const ch = t.charCodeAt(k); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36) + ':' + t.length;
}
async function montarCertificado(reg, nome) {
  const cv = await desenharCertificado({ ...reg, nome });
  const jpg = new Uint8Array(await (await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92))).arrayBuffer());
  const pdf = await pdfDeJPEG(jpg, cv.width, cv.height, nomeCert({ ...reg, nome })).arrayBuffer();
  const th = document.createElement('canvas'); th.width = 420; th.height = Math.round(420 * cv.height / cv.width); th.getContext('2d').drawImage(cv, 0, 0, th.width, th.height);
  return { pdf, thumb: th.toDataURL('image/jpeg', .8), instSig: assinaturaInst() };
}
async function salvarCertificadoLocal(reg, nome) {
  const m = await montarCertificado(reg, nome);
  const extra = reg.tipo === 'curso' ? { tipo: 'curso', cursoId: reg.cursoId, curso: reg.curso, carga: reg.carga, semAvaliacao: !!reg.semAvaliacao } : {};
  const c = { id: reg.id, uid: S.user.id, nome, disciplina: reg.disciplina, nota: reg.nota, acertos: reg.acertos, total: reg.total, data: reg.data, codigo: reg.codigo, ...extra, ...m, salvoEm: Date.now() };
  await CertDB.put(c);
  try { await navigator.storage?.persist?.(); } catch {}
  return c;
}
/* Refaz o PDF de um certificado já emitido com os dados ATUAIS da instituição.
   Nome do aluno, matéria, nota, data e código de verificação continuam exatamente os da emissão. */
async function atualizarCertificadoLocal(c) {
  if (!c || c.instSig === assinaturaInst()) return c;
  const m = await montarCertificado(c, c.nome);
  const novo = { ...c, ...m, atualizadoEm: Date.now() };
  await CertDB.put(novo);
  return novo;
}
let _atualizandoCerts = null;
async function atualizarCertificadosLocais() {
  if (_atualizandoCerts) return _atualizandoCerts;
  return _atualizandoCerts = (async () => {
    let n = 0;
    try { for (const c of await CertDB.doUsuario(S.user.id)) if (c.instSig !== assinaturaInst()) { try { await atualizarCertificadoLocal(c); n++; } catch (e) { console.warn(e); } } }
    catch (e) { console.warn(e); }
    finally { _atualizandoCerts = null; }
    return n;
  })();
}
async function abrirCertificadoLocal(id) {
  try {
    let c = await CertDB.get(id);
    if (!c || c.uid !== S.user.id) return toast('Este certificado não está guardado neste aparelho.', true);
    if (c.instSig !== assinaturaInst()) { toast('Atualizando o certificado com os dados atuais da instituição…'); c = await atualizarCertificadoLocal(c); }
    const f = new File([c.pdf], nomeCert(c) + '.pdf', { type: 'application/pdf' });
    if (isIOS && isStandalone() && navigator.canShare?.({ files: [f] })) { await navigator.share({ files: [f], title: nomeCert(c) }); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (e) { if (e?.name !== 'AbortError') { console.warn(e); toast('Não foi possível abrir o certificado.', true); } }
}
/* Certificados conquistados antes desta versão (sem aparelho registrado) podem ser guardados uma vez */
async function guardarCertificadoAntigo(reg) {
  try { toast('Gerando o certificado…'); await salvarCertificadoLocal(reg, S.user.nome); await abrirCertificadoLocal(reg.id); render(); }
  catch (e) { console.warn(e); toast('Não foi possível gerar o certificado: ' + e.message, true); }
}

  const sel = (id, todos, ops) => `<label class="lf-sel"><span>${todos[0]}</span><select id="${id}" class="field"><option value="">${todos[1]}</option>${ops.map(o => `<option>${esc(o)}</option>`).join('')}</select></label>`;
  return `<div class="card lf">
    <div class="lf-busca">${ic('search', 18)}<input id="lf-q" type="search" placeholder="Buscar lei, número ou assunto" autocomplete="off" enterkeyhint="search" aria-label="Buscar normas"><button type="button" id="lf-x" class="lf-x" aria-label="Limpar busca" hidden>×</button></div>
    <div class="lf-row">
      ${origem ? `<div class="lf-sel lf-orig"><span>Origem</span><div class="segb" id="lf-o" role="group" aria-label="Origem"><button class="on" data-v="">Todas</button><button data-v="auto">Automáticas</button><button data-v="manual">Manuais</button></div></div>` : ''}
      ${tipos.length > 1 ? sel('lf-t', ['Tipo de norma', 'Todos'], tipos) : ''}
      ${discs.length > 1 ? sel('lf-d', ['Disciplina', 'Todas'], discs) : ''}
    </div>
    <div class="lf-rodape"><span id="lf-n">${total} norma${total === 1 ? '' : 's'}</span><button type="button" class="lf-limpar" id="lf-l" hidden>Limpar filtros</button></div>
  </div>`;
}
function ligarFiltroLeis(root, onChange) {
  const st = { q: '', tipo: '', disc: '', origem: '' };
  const q = $('#lf-q', root), x = $('#lf-x', root), lim = $('#lf-l', root);
  const atualiza = () => { x.hidden = !st.q; lim.hidden = !(st.q || st.tipo || st.disc || st.origem); const n = onChange(st); $('#lf-n', root).textContent = `${n} norma${n === 1 ? '' : 's'}${lim.hidden ? '' : ' encontrada' + (n === 1 ? '' : 's')}`; };
  q.oninput = () => { st.q = q.value; atualiza(); };
  x.onclick = () => { q.value = ''; st.q = ''; q.focus(); atualiza(); };
  const t = $('#lf-t', root); if (t) t.onchange = () => { st.tipo = t.value; atualiza(); };
  const d = $('#lf-d', root); if (d) d.onchange = () => { st.disc = d.value; atualiza(); };
  const o = $('#lf-o', root); if (o) o.onclick = e => { const b = e.target.closest('button'); if (!b) return; st.origem = b.dataset.v; $$('button', o).forEach(y => y.classList.toggle('on', y === b)); atualiza(); };
  lim.onclick = () => { q.value = ''; Object.assign(st, { q: '', tipo: '', disc: '', origem: '' }); if (t) t.value = ''; if (d) d.value = ''; if (o) $$('button', o).forEach((y, i) => y.classList.toggle('on', i === 0)); atualiza(); };
  atualiza();
  return st;
}
const discDeLei = p => p.disciplina || (String(p.local || '').split(' · ')[1] || '');
const filtrarLeis = (leis, st) => { const t = norm(st.q); return leis.filter(p => (!st.tipo || p.instituicao === st.tipo) && (!st.disc || discDeLei(p) === st.disc) && (!st.origem || (st.origem === 'auto') === !!p.auto) && (!t || norm(`${p.titulo} ${p.resumo} ${discDeLei(p)} ${p.instituicao}`).includes(t))); };

async function viewBusca(main, _, q) {
  const termo = (q.get('q') || '').trim();

  main.innerHTML = `<div class="page">

    <form class="filters" id="bf"><div class="search">${ic('search')}<input class="field" name="q" value="${esc(termo)}" placeholder="Materiais, vagas, editais, leis…" autocomplete="off"></div></form>
    <div id="res"></div></div>`;
  const draw = t => {
    t = t.toLowerCase().trim();
    if (!t) { $('#res').innerHTML = '<div class="empty"><p>Digite um termo para buscar em todo o portal.</p></div>'; return; }
    const hit = o => Object.values(o).some(v => typeof v === 'string' && v.toLowerCase().includes(t));

    $('#res').innerHTML = (!m.length && !p.length && !ar.length) ? `<div class="card empty"><h3>Nada encontrado</h3><p>Tente outro termo.</p></div>` :

       ${p.length ? `<div class="list-h"><h3>Publicações <span class="badge">${p.length}</span></h3></div><div class="plist">${p.map(postCard).join('')}</div>` : ''}`;
    hidratarImagens($('#res'));

/* ============================== Análises ============================== */
function agregar(users) {
  const ag = { views: {}, downloads: {}, pubs: {}, disp: {}, cols: {}, dias: {}, ativosDia: {}, sessoes: 0 };
  for (const u of users) {
    if (u.role === 'admin') continue; const a = u.atividade || {};
    for (const k of ['views', 'downloads', 'pubs', 'disp', 'cols']) for (const [x, n] of Object.entries(a[k] || {})) ag[k][x] = (ag[k][x] || 0) + n;
    for (const [d, n] of Object.entries(a.dias || {})) { ag.dias[d] = (ag.dias[d] || 0) + n; ag.ativosDia[d] = (ag.ativosDia[d] || 0) + 1; }
    ag.sessoes += a.sessoes || 0;
  }
  return ag;
}
const fmtN = n => Number(n || 0).toLocaleString('pt-BR');
const diasPeriodo = n => Array.from({ length: n }, (_, i) => hojeISO(new Date(Date.now() - (n - 1 - i) * DAY)));
function graficoColunas(serie, rotulo) {
  const max = Math.max(1, ...serie.map(x => x.v));
  const passo = max <= 4 ? 1 : Math.pow(10, Math.floor(Math.log10(max / 2))) * ([1, 2, 5].find(k => max / (Math.pow(10, Math.floor(Math.log10(max / 2))) * k) <= 4) || 10);
  const topo = Math.ceil(max / passo) * passo, linhas = [];
  for (let v = passo; v <= topo; v += passo) linhas.push(v);
  const cada = Math.ceil(serie.length / 6);
  return `<div class="cols-chart" role="img" aria-label="${esc(rotulo)}">
      ${linhas.map(v => `<div class="gl" style="bottom:${v / topo * 100}%"><span>${fmtN(v)}</span></div>`).join('')}<div class="gl" style="bottom:0;border:0"><span>0</span></div>
      ${serie.map(x => `<div class="c" tabindex="0" data-tip="${esc(x.tip)}"><i style="height:${x.v / topo * 100}%"></i></div>`).join('')}
    </div>
    <div class="cols-x">${serie.map((x, i) => `<span>${i % cada === 0 || i === serie.length - 1 ? x.rot : ''}</span>`).join('')}</div>
    <details class="tabela-dados"><summary>Ver dados em tabela</summary><div class="table-wrap"><table><tr><th>Dia</th><th>${esc(rotulo)}</th></tr>${serie.map(x => `<tr><td>${x.rot}</td><td>${fmtN(x.v)}</td></tr>`).join('')}</table></div></details>`;
}
function ranking(itens, vazio) {
  if (!itens.length) return `<p class="muted small" style="margin:0">${vazio}</p>`;
  const max = Math.max(...itens.map(x => x.v));
  return `<div class="rank">${itens.map(x => `<div class="r"><b title="${esc(x.t)}">${esc(x.t)}</b><span class="v">${fmtN(x.v)}</span><span class="bar"><i style="width:${x.v / max * 100}%"></i></span></div>`).join('')}</div>`;
}
function ativarTooltips(root) {
  let tip = null;
  const mostra = el => { tip?.remove(); tip = document.createElement('div'); tip.className = 'tip'; tip.textContent = el.dataset.tip; document.body.appendChild(tip);
    const r = el.getBoundingClientRect(), w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px'; tip.style.top = (r.top - tip.offsetHeight - 8) + 'px'; };
  const some = () => { tip?.remove(); tip = null; };
  root.addEventListener('mouseover', e => { const c = e.target.closest('[data-tip]'); if (c) mostra(c); });
  root.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) some(); });
  root.addEventListener('focusin', e => { const c = e.target.closest('[data-tip]'); if (c) mostra(c); });
  root.addEventListener('focusout', some);
  root.addEventListener('touchstart', e => { const c = e.target.closest('[data-tip]'); if (c) mostra(c); }, { passive: true });
  S.limpar.push(some);
}
function admAnalises(box, { users, mats, posts, pags, codigos, ag }, periodo = 30) {

    </div>

    </div>

async function lerPDFjs(buf) {
  const pdfjs = await carregarPdfJs();
  const doc = await pdfjs.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  let info = {}; try { info = (await doc.getMetadata()).info || {}; } catch {}
  let texto = '', titulo1 = '', subtitulo1 = '';
  const linhas = [];
  for (let i = 1; i <= Math.min(3, doc.numPages); i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    const its = tc.items.filter(x => x.str && x.str.trim());
    if (i === 1 && its.length) { const c = capaPDF(its); titulo1 = c.titulo; subtitulo1 = c.subtitulo; }
    texto += ' ' + its.map(x => x.str).join(' ');
    linhas.push(...its.map(x => x.str));
  }
  texto = texto.replace(/\s+/g, ' ').trim();
  let capa = null; try { capa = await renderCapa(await doc.getPage(1)); } catch (e) { console.warn('capa', e); }
  const r = { capa, paginas: doc.numPages, subtitulo: subtitulo1, titulo: limparTitulo(info.Title) || titulo1, autor: autorValido(info.Author) || linhas.map(autorNoTexto).find(Boolean) || '', assunto: textoValido(info.Subject), palavras: textoValido(info.Keywords), texto, fonte: 'pdfjs' };
  try { await doc.destroy(); } catch {}
  return r;
}

  if (!r) r = lerPDFBasico(buf);
  if (!r.titulo) r.titulo = tituloDoArquivo(file.name);
  const sep = separarTitulo(r.titulo);
  if (sep) { r.titulo = sep.titulo; if (!r.subtitulo) r.subtitulo = sep.subtitulo; }
  if (r.subtitulo && r.subtitulo.toLowerCase() === r.titulo.toLowerCase()) r.subtitulo = '';

  };

}

/* ================================ Boot ================================ */
/* ================================ Cursos online ================================
   Curso (coleção 'cursos'): dados, aulas (vídeo do YouTube ou PDF) e avaliação final
   (banco de questões guardado em arquivo próprio, como os bancos dos materiais).
   Progresso do aluno fica no cadastro dele:
   u.cursos[cursoId] = { inscritoEm, concluidas: { aulaId: data }, ultima, tentativas: [], aprovado: {certificado} }
   Certificado: todas as aulas concluídas + nota ACIMA da mínima do curso (padrão: a do portal, 60%).
   ================================================================================ */
const ytThumb = url => ytId(url) ? `https://i.ytimg.com/vi/${ytId(url)}/mqdefault.jpg` : '';
const notaCurso = c => Number(c?.notaMinima ?? notaMin());
const aulasDe = c => Array.isArray(c?.aulas) ? c.aulas : [];
const temAvaliacao = c => (c?.avaliacao?.total || 0) > 0;
const cargaCurso = c => Number(c?.cargaHoraria) || Math.max(1, Math.round(aulasDe(c).reduce((s, a) => s + (Number(a.duracao) || 0), 0) / 60));
const ordemCursos = (a, b) => (a.ordem ?? 1e9) - (b.ordem ?? 1e9) || (b.criadoEm || 0) - (a.criadoEm || 0);
function progressoCurso(c, p) {
  const aulas = aulasDe(c), feitas = aulas.filter(a => p?.concluidas?.[a.id]).length;
  return { feitas, total: aulas.length, pct: aulas.length ? Math.round(feitas / aulas.length * 100) : 0, tudo: aulas.length > 0 && feitas === aulas.length };
}
const podeVerCurso = (c, u = S.user) => u?.role === 'admin' || c.acesso !== 'assinantes' || ativo(u);
async function salvarProgresso(cid, fn) {
  const u = await store.getUser(S.user.id);
  const cursos = { ...(u?.cursos || {}) };
  cursos[cid] = fn(cursos[cid] ? JSON.parse(JSON.stringify(cursos[cid])) : null);
  await store.updateUser(S.user.id, { cursos });
  S.user = { ...S.user, cursos };
  return cursos[cid];
}
async function carregarBancoCurso(c) {
  if (!c?.avaliacao?.ref) return [];
  const u = await store.fileURL(c.avaliacao.ref, 'application/json');
  return JSON.parse(await (await fetch(u)).text()).questoes || [];
}
async function salvarBancoCurso(c, questoes) {
  const blob = new Blob([JSON.stringify({ curso: c.id, titulo: c.titulo, questoes })], { type: 'application/json' });
  const ref = questoes.length ? await store.uploadFile(new File([blob], 'avaliacao-curso.json', { type: 'application/json' })) : '';
  const antigo = c.avaliacao?.ref, atual = (await store.get('cursos', c.id)) || c;
  const novo = { ...atual, avaliacao: questoes.length ? { ref, total: questoes.length, atualizadoEm: Date.now() } : null };
  await store.save('cursos', novo);
  if (antigo) { try { await store.deleteFile(antigo); } catch (e) { console.warn(e); } }
  return novo;
}
function capaCurso(c, cls = '') {
  return `<div class="cur-capa ${cls}">${c.capa ? `<img data-img="${esc(c.capa)}" alt="">` : `<div class="cur-capa-gen"><span>${ic('grad', 30)}</span><b>${esc(c.titulo || 'Curso')}</b></div>`}</div>`;
}
function metaCurso(c) {
  const n = aulasDe(c).length, v = aulasDe(c).filter(a => a.tipo === 'video').length, p = n - v;
  return `<span>${ic('play', 13)} ${v} vídeo${v === 1 ? '' : 's'}</span>${p ? `<span>${ic('file', 13)} ${p} PDF${p === 1 ? '' : 's'}</span>` : ''}<span>${ic('clock', 13)} ${cargaCurso(c)}h</span><span>${ic('award', 13)} Certificado</span>`;
}
function cardCurso(c, p) {
  const pr = progressoCurso(c, p);
  return `<a class="card cur-card" href="#/curso/${encodeURIComponent(c.id)}">${capaCurso(c)}
    <div class="cur-card-b"><span class="eyebrow">${esc(c.area || 'Curso online')}</span>${c.ativo === false ? ' <span class="badge">Rascunho</span>' : ''}
      <h3>${esc(c.titulo)}</h3>${c.subtitulo ? `<p>${esc(c.subtitulo)}</p>` : ''}
      <div class="cur-meta">${metaCurso(c)}</div>
      ${p ? `<div class="cur-prog"><span><i style="width:${pr.pct}%"></i></span><small>${p.aprovado ? `${ic('award', 13)} Concluído: certificado disponível` : `${pr.pct}% concluído`}</small></div>`
        : `<span class="cur-cta">${c.acesso === 'assinantes' && !podeVerCurso(c) ? `${ic('lock', 13)} Para assinantes` : 'Conhecer o curso'} ${ic('arrow', 14)}</span>`}</div></a>`;
}

    hidratarImagens($('#cur-lista'));

async function salaDeAula(main, c, p, alvo) {
  const aulas = aulasDe(c);

    const aoSair = () => { if (document.visibilityState === 'hidden') salvarPos(true); };
    document.addEventListener('visibilitychange', aoSair);
    const tPos = setInterval(() => { if (estadoYT === 1) salvarPos(Date.now() - ultRemoto > 90000); }, 5000);
    S.limpar.push(() => { clearInterval(tPos); document.removeEventListener('visibilitychange', aoSair); salvarPos(true); });
    window.addEventListener('pagehide', () => salvarPos(false), { once: true });
    const msg = async ev => {
      if (!/youtube\.com$/.test(new URL(ev.origin || 'http://x').hostname) || ev.source !== yt.contentWindow) return;
      let d; try { d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch { return; }
      if (d?.event === 'infoDelivery' && d.info) {
        if (typeof d.info.currentTime === 'number') cur = d.info.currentTime;
        if (d.info.duration) dur = d.info.duration;
        if (typeof d.info.playerState === 'number') { const antes = estadoYT; estadoYT = d.info.playerState; if (estadoYT === 2 && antes !== 2) salvarPos(true); }
        if (Date.now() - ultLocal > 4000) { ultLocal = Date.now(); salvarPos(false); }
      }
      if (d?.event === 'onStateChange') { estadoYT = d.info; if (d.info === 2) salvarPos(true); }
      const fim = (d?.event === 'onStateChange' && d.info === 0) || (d?.event === 'infoDelivery' && d.info?.playerState === 0);
      if (fim) lsSet(kPos, JSON.stringify({ t: 0, at: Date.now() }));
      if (fim && !p.concluidas?.[a.id]) { try { await concluir(a.id); const b = $('#cur-ok'); if (b) { b.className = 'btn ghost'; b.innerHTML = `${ic('check', 16)} Aula concluída`; } toast('Aula concluída.'); } catch (e) { console.warn(e); } }
    };
    window.addEventListener('message', msg); S.limpar.push(() => window.removeEventListener('message', msg));
  }
}

/* Logomarca: mantém a transparência, reduz para no máximo 600 × 300 px */
async function logoOtimizado(file) {
  if (!/^image\//i.test(file?.type || '')) throw new Error('Escolha uma imagem (PNG, JPG, SVG ou WebP).');
  if (file.size > 15e6) throw new Error('Imagem muito grande (máximo de 15 MB).');
  const im = await carregarImg(URL.createObjectURL(file));
  const w0 = im.naturalWidth || im.width || 600, h0 = im.naturalHeight || im.height || 300;
  const k = /svg/i.test(file.type) ? Math.min(600 / w0, 300 / h0) : Math.min(1, 600 / w0, 300 / h0);
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w0 * k)); cv.height = Math.max(1, Math.round(h0 * k));
  cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
  let url = cv.toDataURL('image/png');
  if (url.length > 450000) { const w = cv.toDataURL('image/webp', .9); if (w.startsWith('data:image/webp') && w.length < url.length) url = w; }
  if (url.length > 900000) { const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; const x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(cv, 0, 0); url = c2.toDataURL('image/jpeg', .85); }
  return url;
}

/* QR code com correção de erro alta (Q) e o símbolo do portal no centro */
function desenharQR(c, link, x, y, tam, { logo = true, cor = CORES.toga } = {}) {
  const q = qrcode(0, 'Q'); q.addData(link); q.make();
  const n = q.getModuleCount(), cel = tam / n;

    const x0 = Math.round(x + k * cel), y0 = Math.round(y + r * cel);
    c.fillRect(x0, y0, Math.round(x + (k + 1) * cel) - x0, Math.round(y + (r + 1) * cel) - y0);
  }
  if (logo) {
    const l = tam * .2, lx = x + (tam - l) / 2, ly = y + (tam - l) / 2;
    c.fillStyle = '#fff'; caminhoArredondado(c, lx, ly, l, l, l * .2); c.fill();
    c.fillStyle = CORES.toga; caminhoArredondado(c, lx + l * .1, ly + l * .1, l * .8, l * .8, l * .16); c.fill();
    desenharTemplo(c, x + tam / 2, y + tam / 2, l * .62, CORES.latao2, l * .05);
  }
}
function caminhoArredondado(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();

  c.strokeStyle = cor; c.lineWidth = lw / k; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(new Path2D(TEMPLO)); c.restore();
}

function quebrarLinhas(c, texto, maxW) {
  const linhas = [];
  for (const par of String(texto || '').split(/\n/)) {
    let l = '';
    for (const p of par.split(/\s+/).filter(Boolean)) { const t = l ? l + ' ' + p : p; if (c.measureText(t).width > maxW && l) { linhas.push(l); l = p; } else l = t; }

  q6: { cols: 2, rows: 3, formato: 'quadrado', nome: 'Quadrados grandes' },
  q12: { cols: 3, rows: 4, formato: 'quadrado', nome: 'Quadrados pequenos' },
  e20: { cols: 4, rows: 5, formato: 'etiqueta', nome: 'Etiquetas só com o QR' }

              <div class="actions"><button type="button" class="btn ghost" id="pz-sem">Deixar sem prazo</button>${c.prazos?.[a.id] !== undefined ? '<button type="button" class="btn ghost" id="pz-orig">Voltar ao prazo padrão</button>' : ''}<button class="btn primary">Salvar prazo</button></div></form>`);
            const f = $('#fpz', m.el);
            $$('[data-mais]', m.el).forEach(b => b.onclick = () => { const b0 = Math.max(Date.now(), f.d.value ? new Date(f.d.value + 'T23:59:59').getTime() : Date.now()); f.d.value = iso(b0 + Number(b.dataset.mais) * DAY); });
            const salvar = async val => {
              const prazos = { ...(c.prazos || {}) }; if (val === undefined) delete prazos[a.id]; else prazos[a.id] = val;
              try { await store.save('colunistas', { ...c, prazos }); c.prazos = prazos; m.close(); el.remove(); toast(val === 0 ? 'Artigo sem prazo de expiração.' : 'Prazo atualizado.'); admColunistas(box, ag); } catch (er) { toast(er.message, true); }
            };
            $('#pz-sem', m.el).onclick = () => salvar(0);
            const po = $('#pz-orig', m.el); if (po) po.onclick = () => salvar(undefined);
            f.onsubmit = ev2 => { ev2.preventDefault(); if (!f.d.value) return toast('Escolha a data.', true); salvar(new Date(f.d.value + 'T23:59:59').getTime()); };
          }
          if (o) {
            const id = o.dataset.oc, oc = c.ocultos || [];
            c.ocultos = oc.includes(id) ? oc.filter(x => x !== id) : [...oc, id];
            o.disabled = true;
            try { await store.save('colunistas', c); el.remove(); toast(c.ocultos.includes(id) ? 'Artigo ocultado da Coluna Acadêmica.' : 'Artigo de volta à Coluna Acadêmica.'); admColunistas(box, ag); } catch (er) { toast(er.message, true); o.disabled = false; }
          }
        });
      }
    } catch (er) { toast(er.message, true); }
  };
}

(async function boot() {
  try {
    store = CONFIG.backend === 'firebase' ? await FirebaseStore() : CONFIG.backend === 'gist' ? GistStore() : LocalStore();
    await store.init();
    S.config = await store.getConfig();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="auth"><div class="card"><h2>Não foi possível iniciar</h2><p class="muted">${esc(e.message)}</p><p class="small">${CONFIG.backend === 'firebase' ? 'Verifique as credenciais do Firebase em CONFIG.' : 'Seu navegador precisa permitir IndexedDB (desative a navegação anônima restrita).'}</p></div></div>`;
    return;
  }
  if (isStandalone()) document.documentElement.classList.add('standalone');
  fixarLinkGist();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    try { navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e)); } catch (e) { console.warn(e); }
  }
  window.addEventListener('hashchange', () => { document.querySelectorAll('.modal-bg').forEach(m => m.remove()); render(); });
  let wasMobile = isMobile();
  window.addEventListener('resize', () => { if (isMobile() !== wasMobile) { wasMobile = isMobile(); render(); } });
  render();
})();
</script>
