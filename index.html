<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ágora Jurídica — Portal de Estudos em Direito</title>
<meta name="theme-color" content="#131a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ágora Jurídica">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Videoaulas, áudios e PDFs para estudantes de Direito, com estágios, concursos, empregos e atualizações legislativas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#131a2b; --ink-2:#1c2640; --ink-3:#2a3554;
  --paper:#f6f3ec; --card:#fffdf8; --line:#e5ded0; --line-2:#efe9dd; --muted:#6a6e7a;
  --gold:#b8955a; --gold-2:#dcc597; --wine:#7d1f2e; --wine-2:#5e1520;
  --ok:#2f6b4f; --ok-bg:#e6f0ea; --warn:#9a6114; --warn-bg:#f8eedd; --err:#a3222f; --err-bg:#f7e4e4;
  --r:14px; --shadow:0 1px 2px rgba(19,26,43,.05),0 10px 30px rgba(19,26,43,.07);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0 0 .35em;line-height:1.12;letter-spacing:.2px}
h1{font-size:clamp(2.2rem,4.4vw,3.6rem)} h2{font-size:2rem} h3{font-size:1.4rem} h4{font-size:1.15rem}
p{margin:0 0 1em}
a{color:var(--wine);text-decoration:none} a:hover{text-decoration:underline}
.ic{flex:none;vertical-align:middle}
.muted{color:var(--muted)} .small{font-size:.86rem} .hidden{display:none!important}
.eyebrow{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* Buttons & form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:1px solid transparent;border-radius:999px;padding:.68em 1.25em;font:600 .92rem var(--sans);cursor:pointer;transition:.15s;text-decoration:none!important;white-space:nowrap}
.btn.primary{background:var(--wine);color:#fff}.btn.primary:hover{background:var(--wine-2)}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:var(--ink-3)}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.gold:hover{background:var(--gold-2)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--line-2)}
.btn.light{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}.btn.light:hover{background:rgba(255,255,255,.08)}
.btn.sm{padding:.42em .9em;font-size:.82rem}
.btn.danger{background:transparent;border-color:#e7c4c4;color:var(--err)}.btn.danger:hover{background:var(--err-bg)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{background:none;border:0;cursor:pointer;color:inherit;font-size:1.5rem;line-height:1;padding:.2em .35em;border-radius:8px}
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-size:.84rem;font-weight:600;color:var(--ink-2)}
.form input,.form select,.form textarea,.field{font:400 .95rem var(--sans);padding:.72em .9em;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%;outline:none;transition:.15s}
.form input:focus,.form select:focus,.form textarea:focus,.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,149,90,.18)}
.form textarea{resize:vertical;min-height:90px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex!important;grid-template-columns:none!important;align-items:flex-start;gap:10px!important;font-weight:400!important}
.check input{width:auto;margin-top:3px}
.hint{font-size:.8rem;color:var(--muted);font-weight:400;margin:0}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.err-msg{background:var(--err-bg);color:var(--err);border-radius:10px;padding:.7em .9em;font-size:.88rem}

/* Cards, badges */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:24px}
.badge{display:inline-flex;align-items:center;gap:.35em;font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:.28em .7em;border-radius:999px;background:var(--line-2);color:var(--ink-2);text-transform:uppercase}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.err{background:var(--err-bg);color:var(--err)}
.badge.gold{background:#f3ead7;color:#82642f} .badge.wine{background:#f3e2e4;color:var(--wine)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{color:var(--ink)}
.loading{padding:60px;text-align:center;color:var(--muted)}

/* Public layout */
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none!important}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--gold-2);display:grid;place-items:center;font:700 1.3rem var(--serif)}
.brand b{font:700 1.35rem var(--serif);letter-spacing:.3px}
.brand small{display:block;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:-3px}
.wrap{max-width:1180px;margin:auto;padding:0 24px}
.hero{background:var(--ink);color:#f3efe6;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(700px 380px at 85% 10%,rgba(184,149,90,.22),transparent 60%),radial-gradient(500px 300px at 0% 100%,rgba(125,31,46,.35),transparent 60%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.25fr .9fr;gap:48px;padding-top:84px;padding-bottom:84px;align-items:center}
.hero h1{color:#fff}.hero h1 em{color:var(--gold-2);font-style:italic}
.hero p.lead{font-size:1.1rem;color:#c9cdd8;max-width:560px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero-panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:26px}
.hero-panel .li{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.hero-panel .li:last-child{border:0}
.hero-panel .li .ic{color:var(--gold-2);margin-top:2px}
.hero-panel .li b{display:block;color:#fff;font-weight:600}
.hero-panel .li span{font-size:.86rem;color:#aab0bf}
.section{padding:76px 0}
.section-h{max-width:640px;margin-bottom:36px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.feature{padding:26px}
.feature .ic-wrap{width:44px;height:44px;border-radius:12px;background:#f3ead7;color:#82642f;display:grid;place-items:center;margin-bottom:14px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.step{padding:26px;border-top:2px solid var(--gold)}
.step:before{counter-increment:s;content:"0" counter(s);font:600 2.4rem var(--serif);color:var(--gold);display:block;margin-bottom:6px}
.price-card{max-width:440px;margin:auto;padding:34px;text-align:center}
.price{font:600 3.2rem var(--serif);color:var(--ink);line-height:1}
.price small{font:500 1rem var(--sans);color:var(--muted)}
.ticks{list-style:none;padding:0;margin:20px 0;text-align:left;display:grid;gap:10px}
.ticks li{display:flex;gap:10px;align-items:flex-start}.ticks .ic{color:var(--ok);margin-top:2px}
.footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:.85rem}
.footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* Auth */
.auth{min-height:calc(100vh - 66px);display:grid;place-items:center;padding:40px 18px}
.auth .card{width:100%;max-width:480px;padding:34px}
.auth h2{margin-bottom:4px}
.demo-hint{background:#f3ead7;border-radius:10px;padding:.7em .9em;font-size:.84rem;color:#6d5428}

/* App layout */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{background:var(--ink);color:#c6cbd8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 16px}
.side .brand{color:#fff;padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px}
.side .brand .mark{background:var(--gold);color:var(--ink)}
.side .brand small{color:#8c93a6}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:.68em .8em;border-radius:10px;color:#c6cbd8;font-weight:500;font-size:.92rem;text-decoration:none!important}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:rgba(184,149,90,.16);color:#fff}
.nav a.on .ic{color:var(--gold-2)}
.nav a .lk{margin-left:auto;opacity:.6}
.nav .sep{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#6f7790;padding:16px 12px 6px}
.side .me{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:16px 8px 0;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink-3);color:var(--gold-2);display:grid;place-items:center;font-weight:700;flex:none}
.side .me .nm{color:#fff;font-weight:600;font-size:.88rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .me .st{font-size:.74rem;color:#8c93a6}
.side .me button{margin-left:auto;color:#8c93a6}
.side .me button:hover{color:#fff;background:rgba(255,255,255,.06)}
.mainwrap{min-width:0}
.mobilebar{display:none}
.page{padding:36px 40px 60px;max-width:1240px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.page-h h2{margin:0}
.page-h p{margin:.3em 0 0;color:var(--muted)}

/* Dashboard */
.banner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px;border-radius:var(--r);background:var(--ink);color:#e9e6dd;margin-bottom:24px;flex-wrap:wrap}
.banner h3{color:#fff;margin:0}
.banner p{margin:.25em 0 0;color:#b6bccb;font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat{padding:20px 22px}
.stat .n{font:600 2.2rem var(--serif);line-height:1}
.stat .l{font-size:.8rem;color:var(--muted);margin-top:6px}
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}
.list-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.list-h h3{margin:0}

/* Materials */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.search{position:relative;flex:1;min-width:220px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.45em 1em;font:500 .85rem var(--sans);cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.mcard{display:flex;flex-direction:column;overflow:hidden;color:inherit;text-decoration:none!important;transition:.18s}
.mcard:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(19,26,43,.12)}
.mthumb{height:118px;display:grid;place-items:center;position:relative}
.mthumb.video{background:linear-gradient(135deg,#1c2640,#33406a)}
.mthumb.audio{background:linear-gradient(135deg,#5e1520,#8f3141)}
.mthumb.pdf{background:linear-gradient(135deg,#6d5428,#b8955a)}
.mthumb .ic{color:rgba(255,255,255,.9)}
.mthumb .badge{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92)}
.mbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.mbody h4{margin:0;font-size:1.2rem}
.mbody .d{font-size:.78rem;color:var(--gold);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.mbody p{font-size:.87rem;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.player{background:#0d1220;border-radius:var(--r);overflow:hidden}
.player video{width:100%;display:block;max-height:72vh;background:#000}
.player iframe{width:100%;border:0;display:block}
.embed{position:relative;padding-top:56.25%}.embed iframe{position:absolute;inset:0;height:100%}
.pdf-frame{height:78vh;background:#fff}
.audio-box{padding:46px 30px;text-align:center;background:linear-gradient(135deg,#1c2640,#5e1520);color:#fff}
.audio-box audio{width:100%;max-width:560px;margin-top:20px}
.mini-list{display:grid}
.mini{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line-2);color:inherit;text-decoration:none!important}
.mini:last-child{border-bottom:0}
.mini:hover{background:#fbf8f1}
.mini .tic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:#f3ead7;color:#82642f}
.mini b{display:block;font-weight:600;font-size:.93rem}
.mini span{font-size:.8rem;color:var(--muted)}

/* Opportunities / posts */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{padding:.75em 1.1em;border:0;background:none;font:600 .9rem var(--sans);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none!important}
.tab.on{color:var(--ink);border-color:var(--wine)}
.plist{display:grid;gap:14px}
.post{padding:22px 24px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.post h4{margin:6px 0 4px;font-size:1.3rem}
.post h4 a{color:var(--ink)}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.83rem;color:var(--muted);margin:6px 0 8px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.post p{margin:0;color:#3d4252;font-size:.92rem}
.timeline{position:relative;padding-left:28px;display:grid;gap:16px}
.timeline:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative}
.tl-item:before{content:"";position:absolute;left:-26px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--wine)}
.article{max-width:820px}
.article .body{font-size:1rem;line-height:1.75;color:#2a2f3d}
.article .body p{margin:0 0 1.1em}

/* Tables / admin */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbf8f1}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.progress{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}

/* Modal, toast */
.modal-bg{position:fixed;inset:0;background:rgba(13,18,32,.55);display:grid;place-items:center;z-index:100;padding:18px;animation:fade .15s}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{max-width:760px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0}
.modal-b{padding:22px 24px}
#toasts{position:fixed;bottom:22px;right:22px;display:grid;gap:10px;z-index:200}
.toast{background:var(--ink);color:#fff;padding:.85em 1.15em;border-radius:12px;box-shadow:var(--shadow);font-size:.9rem;max-width:360px;animation:up .2s;border-left:3px solid var(--gold)}
.toast.err{border-color:#e06b78}
@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(8px)}}

/* Plan / checkout */
.checkout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.method{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;font-weight:600;font-size:.88rem;background:#fff}
.method input{display:none}
.method:has(input:checked){border-color:var(--wine);box-shadow:0 0 0 3px rgba(125,31,46,.12);color:var(--wine)}
.mode-tag{font-size:.74rem;color:var(--muted)}

@media (max-width:1000px){
  .hero .wrap,.cols,.checkout{grid-template-columns:1fr}
  .grid3,.steps{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
}
/* ---------- Desktop: barra superior de sistema ---------- */
.deskbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:20px;padding:12px 40px;background:rgba(246,243,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumb{font-size:.86rem;display:flex;gap:8px;align-items:center;white-space:nowrap}
.crumb .sl{color:var(--line)}
.gsearch{position:relative;margin-left:auto;width:min(420px,40vw)}
.gsearch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gsearch input{width:100%;padding:.55em 4.2em .55em 2.4em;border:1px solid var(--line);border-radius:10px;background:#fff;font:400 .88rem var(--sans);outline:none}
.gsearch input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,149,90,.18)}
.gsearch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 .68rem var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--paper)}
.uchip{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;font-size:.88rem;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);background:#fff;text-decoration:none!important}
.avatar.sm{width:28px;height:28px;font-size:.72rem}
.apphead,.tabbar,.mback,.mobile-only{display:none}
.install{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.install .ico{width:48px;height:48px;border-radius:12px;background:var(--ink);color:var(--gold-2);display:grid;place-items:center;font:700 1.4rem var(--serif);flex:none}
.install p{margin:0}
.install .x{margin-left:auto}
.welcome{min-height:100vh;min-height:100dvh;background:var(--ink);color:#e9e6dd;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 48px) 26px calc(env(safe-area-inset-bottom) + 28px);position:relative;overflow:hidden}
.welcome:before{content:"";position:absolute;inset:0;background:radial-gradient(420px 300px at 90% 0%,rgba(184,149,90,.25),transparent 60%),radial-gradient(380px 300px at 0% 100%,rgba(125,31,46,.4),transparent 60%)}
.welcome>*{position:relative}
.welcome .bigmark{width:76px;height:76px;border-radius:22px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font:700 2.6rem var(--serif);margin-bottom:28px}
.welcome h1{color:#fff;font-size:2.5rem}.welcome h1 em{color:var(--gold-2)}
.welcome .wl{display:grid;gap:14px;margin:26px 0}
.welcome .wl div{display:flex;gap:12px;align-items:center;color:#c9cdd8}
.welcome .wl .ic{color:var(--gold-2)}
.welcome .acts{margin-top:auto;display:grid;gap:10px}
.welcome .btn{padding:1em;font-size:1rem}

/* ---------- Celular: experiência de aplicativo ---------- */
@media (max-width:820px){
  html,body{overscroll-behavior-y:none}
  body{-webkit-tap-highlight-color:transparent;font-size:15.5px}
  .side,.deskbar{display:none}
  .app{display:block;min-height:100vh}
  .mobile-only{display:block}

/* ============================== Utils =============================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const fmtDate = v => { if (!v) return '—'; const d = typeof v === 'string' ? new Date(v + 'T12:00:00') : new Date(v); return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR'); };
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtSize = b => !b ? '' : b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' KB';
const safeURL = u => /^(https?:|blob:)/i.test(String(u || '')) ? u : '#';
const paras = t => esc(t).split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const byNewest = (a, b) => (b.criadoEm || 0) - (a.criadoEm || 0);

async function hash(senha, salt) {
  const data = new TextEncoder().encode(salt + ':' + senha);
  if (crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 0; for (const c of data) h = (h * 31 + c) | 0; return 'x' + h;
}

let objectURLs = [];
const trackURL = u => (objectURLs.push(u), u);
const revokeURLs = () => { objectURLs.forEach(u => URL.revokeObjectURL(u)); objectURLs = []; };

const I = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  book: '<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20"/>',

  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  pin: '<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',

const ic = (n, s = 18) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[n] || ''}</svg>`;

function toast(msg, err = false) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  const box = $('#toasts'); while (box.children.length >= 3) box.firstChild.remove(); box.appendChild(t); setTimeout(() => t.remove(), 3800);
}
function modal(title, body, { wide = false } = {}) {
  const el = document.createElement('div'); el.className = 'modal-bg';
  el.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Fechar">×</button></div><div class="modal-b">${body}</div></div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) close(); });
  return { el, close };
}
function confirmar(msg, ok = 'Confirmar') {
  return new Promise(res => {
    const { el, close } = modal('Confirmação', `<p>${esc(msg)}</p><div class="actions"><button class="btn ghost" data-no>Cancelar</button><button class="btn primary" data-yes>${esc(ok)}</button></div>`);
    $('[data-yes]', el).onclick = () => { close(); res(true); };
    $('[data-no]', el).onclick = () => { close(); res(false); };

/* ===================== Camada de dados: IndexedDB ===================== */
function LocalStore({ seed = true } = {}) {
  let db;
  const STORES = ['users', 'materiais', 'publicacoes', 'arquivos', 'pagamentos', 'config', 'codigos'];
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('agora-juridica', 2);
    r.onupgradeneeded = () => { for (const s of STORES) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const op = (s, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(s, mode); const req = fn(t.objectStore(s));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  const all = s => op(s, 'readonly', o => o.getAll());
  const get = (s, id) => op(s, 'readonly', o => o.get(id));
  const put = (s, v) => op(s, 'readwrite', o => o.put(v));
  const del = (s, id) => op(s, 'readwrite', o => o.delete(id));
  const pub = u => { if (!u) return null; const { senhaHash, salt, ...r } = u; return r; };

  return {
    modo: 'local',
    async init() {
      db = await open();
      if (!seed) return;
      if (!(await all('users')).length) {
        const salt = uid();
        await put('users', { id: uid(), nome: 'Administrador', email: 'admin@agora.local', role: 'admin', criadoEm: Date.now(), assinatura: null, telefone: '', instituicao: '', semestre: '', salt, senhaHash: await hash('admin123', salt) });
      }
      if (!(await get('config', 'seed'))) {
        let t = Date.now();
        for (const p of SEED_POSTS) await put('publicacoes', { ...p, id: uid(), criadoEm: t-- });
        await put('config', { id: 'seed', ok: true });
      }
    },
    async register(d) {
      const email = d.email.trim().toLowerCase();
      if ((await all('users')).some(u => u.email === email)) throw new Error('Este e-mail já está cadastrado.');
      if (d.senha.length < 6) throw new Error('A senha deve ter pelo menos 6 caracteres.');
      const salt = uid();
      const u = { id: uid(), nome: d.nome.trim(), email, telefone: d.telefone || '', instituicao: d.instituicao || '', semestre: d.semestre || '', role: 'aluno', criadoEm: Date.now(), assinatura: d.assinatura || null, salt, senhaHash: await hash(d.senha, salt) };
      await put('users', u); await put('config', { id: 'sessao', userId: u.id });
      return pub(u);
    },
    async login(email, senha) {
      email = email.trim().toLowerCase();
      const u = (await all('users')).find(x => x.email === email);
      if (!u || u.senhaHash !== await hash(senha, u.salt)) throw new Error('E-mail ou senha incorretos.');
      await put('config', { id: 'sessao', userId: u.id });
      return pub(u);
    },
    async logout() { await del('config', 'sessao'); },
    async currentUser() { const s = await get('config', 'sessao'); return s ? pub(await get('users', s.userId)) : null; },
    async getUser(id) { return pub(await get('users', id)); },
    async listUsers() { return (await all('users')).map(pub); },
    async updateUser(id, patch) { const u = await get('users', id); Object.assign(u, patch); await put('users', u); return pub(u); },
    async list(col, filtro) { const r = await all(col); return filtro ? r.filter(x => x[filtro[0]] === filtro[1]) : r; },
    async get(col, id) { return (await get(col, id)) || null; },
    async save(col, o) { o = { ...o }; if (!o.id) { o.id = uid(); o.criadoEm = Date.now(); } o.atualizadoEm = Date.now(); await put(col, o); return o; },
    remove: (col, id) => del(col, id),
    async uploadFile(file, onProgress) { const id = uid(); onProgress?.(0.4); await put('arquivos', { id, blob: file, nome: file.name, mime: file.type }); onProgress?.(1); return 'idb:' + id; },
    async fileURL(ref) { if (!ref?.startsWith('idb:')) return ref; const f = await get('arquivos', ref.slice(4)); return f ? trackURL(URL.createObjectURL(f.blob)) : null; },
    async deleteFile(ref) { if (ref?.startsWith('idb:')) await del('arquivos', ref.slice(4)); },
    async getConfig() { return { ...DEFAULT_CFG, ...((await get('config', 'geral')) || {}) }; },
    async saveConfig(c) { await put('config', { ...c, id: 'geral' }); }
  };
}

/* ================== Camada de dados: Firebase (nuvem) ================= */
async function FirebaseStore() {
  const base = `https://www.gstatic.com/firebasejs/${CONFIG.firebaseVersion}/`;
  const [AppM, A, F, ST] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js', 'firebase-storage.js'].map(f => import(base + f)));
  const app = AppM.initializeApp(CONFIG.firebase);
  const auth = A.getAuth(app), db = F.getFirestore(app), st = ST.getStorage(app);
  await new Promise(r => { const un = A.onAuthStateChanged(auth, () => { un(); r(); }); });

  const MSG = {
    'auth/email-already-in-use': 'Este e-mail já está cadastrado.', 'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'E-mail ou senha incorretos.', 'auth/user-not-found': 'E-mail ou senha incorretos.',
    'auth/weak-password': 'A senha deve ter pelo menos 6 caracteres.', 'auth/invalid-email': 'E-mail inválido.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos.', 'permission-denied': 'Acesso negado. Verifique sua assinatura ou permissões.',
    'storage/unauthorized': 'Sem permissão para acessar este arquivo.'
  };
  const wrap = fn => async (...a) => { try { return await fn(...a); } catch (e) { console.error(e); throw new Error(MSG[e.code] || e.message); } };
  const col = c => F.collection(db, c);
  const ref = (c, id) => F.doc(db, c, id);
  const clean = o => JSON.parse(JSON.stringify(o)); // remove undefined

  const s = {
    modo: 'firebase',
    async init() {},
    register: wrap(async d => {
      const c = await A.createUserWithEmailAndPassword(auth, d.email.trim(), d.senha);
      const u = { id: c.user.uid, nome: d.nome.trim(), email: d.email.trim().toLowerCase(), telefone: d.telefone || '', instituicao: d.instituicao || '', semestre: d.semestre || '', role: 'aluno', criadoEm: Date.now(), assinatura: d.assinatura || null };
      await F.setDoc(ref('users', u.id), u);
      return u;
    }),
    login: wrap(async (e, p) => { await A.signInWithEmailAndPassword(auth, e.trim(), p); return s.currentUser(); }),
    logout: () => A.signOut(auth),
    async currentUser() {
      const fu = auth.currentUser; if (!fu) return null;
      const snap = await F.getDoc(ref('users', fu.uid));
      if (snap.exists()) return snap.data();
      const u = { id: fu.uid, nome: fu.displayName || fu.email.split('@')[0], email: (fu.email || '').toLowerCase(), telefone: '', instituicao: '', semestre: '', role: 'aluno', criadoEm: Date.now(), assinatura: null };
      await F.setDoc(ref('users', fu.uid), u); return u;
    },
    getUser: wrap(async id => { const d = await F.getDoc(ref('users', id)); return d.exists() ? d.data() : null; }),
    listUsers: wrap(async () => (await F.getDocs(col('users'))).docs.map(d => d.data())),
    updateUser: wrap(async (id, p) => { await F.updateDoc(ref('users', id), clean(p)); return s.getUser(id); }),
    list: wrap(async (c, f) => { const q = f ? F.query(col(c), F.where(f[0], '==', f[1])) : col(c); return (await F.getDocs(q)).docs.map(d => ({ ...d.data(), id: d.id })); }),
    get: wrap(async (c, id) => { const d = await F.getDoc(ref(c, id)); return d.exists() ? { ...d.data(), id: d.id } : null; }),
    save: wrap(async (c, o) => { o = { ...o }; if (!o.id) { o.id = F.doc(col(c)).id; o.criadoEm = Date.now(); } o.atualizadoEm = Date.now(); await F.setDoc(ref(c, o.id), clean(o)); return o; }),
    remove: wrap((c, id) => F.deleteDoc(ref(c, id))),
    uploadFile: (file, onProgress) => new Promise((res, rej) => {
      const path = `materiais/${uid()}-${file.name.replace(/[^\w.\-]/g, '_')}`;
      const t = ST.uploadBytesResumable(ST.ref(st, path), file, { contentType: file.type });
      t.on('state_changed', sn => onProgress?.(sn.bytesTransferred / sn.totalBytes), e => rej(new Error(MSG[e.code] || e.message)), () => res('st:' + path));
    }),
    async fileURL(r) { if (!r?.startsWith('st:')) return r; return ST.getDownloadURL(ST.ref(st, r.slice(3))); },
    async deleteFile(r) { if (r?.startsWith('st:')) { try { await ST.deleteObject(ST.ref(st, r.slice(3))); } catch (e) { console.warn(e); } } },
    async getConfig() { try { const d = await F.getDoc(ref('config', 'geral')); return { ...DEFAULT_CFG, ...(d.exists() ? d.data() : {}) }; } catch { return { ...DEFAULT_CFG }; } },
    saveConfig: wrap(c => F.setDoc(ref('config', 'geral'), clean({ ...c, id: 'geral' })))
  };
  return s;
}

/* ================= Camada de dados: GitHub Gist (nuvem grátis) =================
   Conteúdo do portal → arquivo agora-dados.json num Gist do administrador.
   - Alunos LEEM o Gist pelo endereço público "raw" (sem login no GitHub).
   - Só o administrador ESCREVE, usando um token pessoal do GitHub que fica
     guardado apenas no navegador dele (nunca vai para o Gist).
   - Contas de alunos, mês grátis e códigos resgatados ficam no aparelho do aluno.
   ============================================================================= */
function GistStore() {
  const L = LocalStore({ seed: false });
  const API = 'https://api.github.com', FILE = 'agora-dados.json';
  const GIST_COLS = ['materiais', 'publicacoes', 'codigos'];
  let G = null, data = null, loadedAt = 0, admin = null;
  const novoDados = () => ({ versao: 1, config: { ...DEFAULT_CFG }, materiais: [], codigos: [], publicacoes: SEED_POSTS.map((p, i) => ({ ...p, id: uid(), criadoEm: Date.now() - i })) });
  const parseG = s => { const m = String(s || '').trim().match(/^([\w-]+)\/([0-9a-f]{20,40})$/i); return m ? { user: m[1], id: m[2] } : null; };
  async function gh(path, opt = {}, token = admin?.token) {
    let r;
    try { r = await fetch(API + path, { ...opt, headers: { Accept: 'application/vnd.github+json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } }); }
    catch { throw new Error('Sem conexão com o GitHub. Verifique sua internet.'); }
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(r.status === 401 ? 'Token do GitHub inválido ou expirado.' : r.status === 404 ? 'Gist não encontrado ou o token não tem permissão de Gist.' : r.status === 403 || r.status === 429 ? 'O GitHub recusou a operação (permissão ou limite de uso). Tente novamente em alguns minutos.' : r.status === 422 ? 'O GitHub não aceitou o arquivo (tamanho ou formato).' : (j.message || 'Erro ' + r.status));
    }
    return r.status === 204 ? null : r.json();
  }
  const raw = f => `https://gist.githubusercontent.com/${G.user}/${G.id}/raw/${encodeURIComponent(f)}`;
  async function load() {
    let d;
    if (admin) {
      const g = await gh('/gists/' + G.id); const f = g.files[FILE];
      if (!f) throw new Error('O Gist não contém o arquivo ' + FILE + '.');
      d = JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
    } else {
      let r; try { r = await fetch(raw(FILE) + '?v=' + Date.now(), { cache: 'no-store' }); } catch { throw new Error('Sem conexão para carregar o conteúdo do portal.'); }
      if (!r.ok) throw new Error('Não foi possível carregar o conteúdo do portal. Confira o link recebido.');
      d = await r.json();
    }
    data = { config: {}, materiais: [], publicacoes: [], codigos: [], ...d }; loadedAt = Date.now();
    try { await L.save('config', { id: 'gist-cache', data }); } catch {}
  }
  async function ensure(force) {
    if (!G) return;
    if (!force && data && Date.now() - loadedAt < 60000) return;
    try { await load(); }
    catch (e) {
      if (!data) { const c = await L.get('config', 'gist-cache'); if (c?.data) { data = c.data; return; } }
      if (force || !data) throw e;
    }
  }
  async function commit() { await gh('/gists/' + G.id, { method: 'PATCH', body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(data, null, 1) } } }) }); loadedAt = Date.now(); }
  async function mutate(fn) { if (!admin) throw new Error('Apenas o administrador pode alterar o conteúdo.'); await ensure(true); const r = fn(data); await commit(); return r; }
  const adminUser = () => admin && ({ id: 'gh:' + admin.login, nome: admin.nome || admin.login, email: '@' + admin.login + ' (GitHub)', role: 'admin', assinatura: null, telefone: '', instituicao: '', semestre: '', criadoEm: admin.desde });

  return {
    modo: 'gist',
    get configurado() { return !!G; },
    get gist() { return G; },
    async init() {
      await L.init();
      const fromURL = parseG(new URLSearchParams(location.search).get('gist'));
      const fromCfg = CONFIG.gist?.user && CONFIG.gist?.id ? { user: CONFIG.gist.user, id: CONFIG.gist.id } : null;
      const saved = await L.get('config', 'gist-ref');
      G = fromCfg || fromURL || saved?.g || null;
      if (fromURL && !fromCfg) await L.save('config', { id: 'gist-ref', g: fromURL });
      admin = (await L.get('config', 'admin-gh')) || null;
      if (admin && G && admin.login.toLowerCase() !== G.user.toLowerCase()) admin = null;
      if (G) { try { await ensure(true); } catch (e) { console.warn(e); } }
    },
    async entrarAdmin(token) {
      token = token.trim();
      if (!token) throw new Error('Cole o token do GitHub.');
      const u = await gh('/user', {}, token);
      if (G && u.login.toLowerCase() !== G.user.toLowerCase()) throw new Error(`Este token é da conta @${u.login}, mas o portal usa o Gist de @${G.user}.`);
      admin = { id: 'admin-gh', token, login: u.login, nome: u.name || u.login, desde: Date.now() };
      let criado = false;
      if (!G) {
        const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Ágora Jurídica — dados do portal (não apague)', public: false, files: { [FILE]: { content: JSON.stringify(novoDados(), null, 1) } } }) });
        G = { user: u.login, id: g.id }; criado = true;
        await L.save('config', { id: 'gist-ref', g: G });
      }
      await L.save('config', admin); await L.logout(); await ensure(true);
      return { user: adminUser(), criado };
    },
    register: d => L.register(d),
    login: (e, s) => L.login(e, s),
    async logout() { if (admin) { admin = null; await L.remove('config', 'admin-gh'); } await L.logout(); },
    async currentUser() { return admin ? adminUser() : L.currentUser(); },
    async getUser(id) { return admin && id === 'gh:' + admin.login ? adminUser() : L.getUser(id); },
    listUsers: () => L.listUsers(),
    async updateUser(id, p) {
      if (admin && id === 'gh:' + admin.login) { admin.nome = p.nome || admin.nome; await L.save('config', admin); return adminUser(); }
      return L.updateUser(id, p);
    },
    async list(col, f) { if (!GIST_COLS.includes(col)) return L.list(col, f); await ensure(); const r = (data?.[col] || []).map(x => ({ ...x })); return f ? r.filter(x => x[f[0]] === f[1]) : r; },
    async get(col, id) { if (!GIST_COLS.includes(col)) return L.get(col, id); await ensure(); const x = (data?.[col] || []).find(x => x.id === id); return x ? { ...x } : null; },
    async save(col, o) {
      if (!GIST_COLS.includes(col)) return L.save(col, o);
      o = { ...o }; if (!o.id) { o.id = uid(); o.criadoEm = Date.now(); } o.atualizadoEm = Date.now();
      await mutate(d => { d[col] = d[col] || []; const i = d[col].findIndex(x => x.id === o.id); if (i >= 0) d[col][i] = o; else d[col].push(o); });
      return o;
    },
    async remove(col, id) { if (!GIST_COLS.includes(col)) return L.remove(col, id); await mutate(d => { d[col] = (d[col] || []).filter(x => x.id !== id); }); },
    async uploadFile(file, onProgress) {
      if (!admin) throw new Error('Apenas o administrador pode enviar arquivos.');
      if (file.size > 4 * 1024 * 1024) throw new Error('No Gist, envie arquivos de até 4 MB. Para vídeos e arquivos maiores, use um link do YouTube ou do Google Drive.');
      onProgress?.(0.15);
      const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
      onProgress?.(0.45);
      const name = `arquivo-${uid().replace(/-/g, '').slice(0, 10)}.b64.txt`;
      await gh('/gists/' + G.id, { method: 'PATCH', body: JSON.stringify({ files: { [name]: { content: b64 } } }) });
      onProgress?.(1);
      return 'gist:' + name;
    },
    async fileURL(ref, mime) {
      if (!ref?.startsWith('gist:')) return ref;
      const name = ref.slice(5);
      let rec = await L.get('arquivos', 'gist:' + name);
      if (!rec) {
        const r = await fetch(raw(name)); if (!r.ok) throw new Error('Arquivo não encontrado no Gist.');
        const bin = atob((await r.text()).replace(/\s/g, '')); const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        rec = { id: 'gist:' + name, blob: new Blob([u8], { type: mime || 'application/octet-stream' }) };
        try { await L.save('arquivos', rec); } catch {}
      }
      return trackURL(URL.createObjectURL(rec.blob));
    },
    async deleteFile(ref) {
      if (!ref?.startsWith('gist:') || !admin) return;
      const name = ref.slice(5);
      try { await gh('/gists/' + G.id, { method: 'PATCH', body: JSON.stringify({ files: { [name]: null } }) }); } catch (e) { console.warn(e); }
      try { await L.remove('arquivos', 'gist:' + name); } catch {}
    },
    async getConfig() { return { ...DEFAULT_CFG, ...(data?.config || {}) }; },
    async saveConfig(c) { await mutate(d => { d.config = { ...c, id: 'geral' }; }); }
  };
}

/* ============================ Estado/regras ============================ */
const S = { user: null, config: { ...DEFAULT_CFG }, navCount: 0 };
let store;
const ativo = u => !!u && (u.role === 'admin' || (u.assinatura?.status === 'ativa' && u.assinatura.validade > Date.now()));
function statusAss(u) {
  if (!u) return { txt: '—', cls: '' };
  if (u.role === 'admin') return { txt: 'Administrador', cls: 'gold' };
  const a = u.assinatura;
  if (!a) return { txt: 'Sem assinatura', cls: 'warn' };
  if (a.status === 'cancelada') return { txt: 'Cancelada', cls: 'err' };
  if (a.validade > Date.now()) return a.tipo === 'teste' ? { txt: 'Grátis até ' + fmtDate(a.validade), cls: 'gold' } : { txt: 'Ativa até ' + fmtDate(a.validade), cls: 'ok' };
  return { txt: 'Expirada em ' + fmtDate(a.validade), cls: 'err' };
}
async function ativarAssinatura(userId, dias = Number(S.config.diasAcesso) || 30) {
  const u = await store.getUser(userId);
  const vigente = u.assinatura?.status === 'ativa' && u.assinatura.validade > Date.now();
  const base = vigente ? u.assinatura.validade : Date.now();
  return store.updateUser(userId, { assinatura: { status: 'ativa', tipo: 'pago', inicio: vigente ? u.assinatura.inicio : Date.now(), validade: base + dias * DAY } });
}
const diasTeste = () => Math.max(0, Number(S.config.diasTeste) || 0);
const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function novoCodigo() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(8));
  const x = [...r].map(n => A[n % A.length]).join('');
  return `AJ-${x.slice(0, 4)}-${x.slice(4)}`;
}
async function resgatarCodigo(code) {
  const h = await hash(normCode(code), 'agora-codigo');
  const c = (await store.list('codigos')).find(x => x.hash === h);
  if (!c) throw new Error('Código inválido. Confira as letras e números.');
  if (c.validoAte && new Date(c.validoAte + 'T23:59:59') < Date.now()) throw new Error('Este código expirou. Peça um novo ao administrador.');
  const u = await store.getUser(S.user.id), usados = u.codigosUsados || [];
  if (usados.includes(c.id)) throw new Error('Você já usou este código.');
  await ativarAssinatura(u.id, Number(c.dias) || Number(S.config.diasAcesso) || 30);
  await store.updateUser(u.id, { codigosUsados: [...usados, c.id] });
  return c;
}
async function copiar(txt) { try { await navigator.clipboard.writeText(txt); toast('Copiado!'); } catch { toast('Selecione o texto e copie manualmente.', true); } }
function prazoBadge(p) {
  if (p.categoria === 'lei') return `<span class="badge wine">${ic('scale', 12)} ${fmtDate(p.prazo)}</span>`;
  if (!p.prazo) return '';
  const d = Math.ceil((new Date(p.prazo + 'T23:59:59') - Date.now()) / DAY);
  if (d < 0) return '<span class="badge err">Encerrado</span>';
  if (d <= 7) return `<span class="badge warn">${d === 0 ? 'Último dia' : `Faltam ${d} dia${d > 1 ? 's' : ''}`}</span>`;
  return '<span class="badge ok">Inscrições abertas</span>';
}

const ROUTES = {
  '':            { view: viewHome },
  entrar:        { view: viewLogin, guest: true },
  cadastro:      { view: viewCadastro, guest: true },
  assinar:       { view: viewAssinar, auth: true },
  painel:        { view: viewPainel, auth: true },

  material:      { view: viewMaterial, auth: true, ativo: true },

  legislacao:    { view: viewLegislacao, auth: true, ativo: true },
  publicacao:    { view: viewPublicacao, auth: true, ativo: true },
  perfil:        { view: viewPerfil, auth: true },
  busca:         { view: viewBusca, auth: true, ativo: true },
  admin:         { view: viewAdmin, auth: true, admin: true }
};
function go(h) { const t = '#/' + h; if (location.hash === t) render(); else location.hash = t; }

async function render() {
  revokeURLs(); S.navCount++;
  const [path, qs] = location.hash.replace(/^#\/?/, '').split('?');
  const [name = '', param] = path.split('/');
  const q = new URLSearchParams(qs || '');
  const r = ROUTES[name] || ROUTES[''];
  try { S.user = await store.currentUser(); } catch (e) { console.error(e); S.user = null; }
  if (r.auth && !S.user) return go('entrar');
  if (r.guest && S.user) return go('painel');
  if (name === '' && S.user) return go('painel');
  if (r.admin && S.user?.role !== 'admin') return go('painel');
  if (r.ativo && !ativo(S.user)) { toast('Assine o portal para acessar este conteúdo.'); return go('assinar'); }

  const app = $('#app');
  if (store.modo === 'gist' && !store.configurado && !S.user) {
    app.innerHTML = publicHTML('setup'); bindShell(); await viewSemGist($('#main')); return;
  }
  app.innerHTML = S.user ? shellHTML(name) : publicHTML(name);
  const main = $('#main');
  main.innerHTML = '<div class="loading">Carregando…</div>';
  bindShell();
  try { await r.view(main, param, q); bindInstall(); }
  catch (e) { console.error(e); main.innerHTML = `<div class="page"><div class="card empty"><h3>Não foi possível carregar</h3><p>${esc(e.message)}</p></div></div>`; }
  window.scrollTo(0, 0);
}

function embedURL(url) {
  const yt = String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
  const vm = String(url).match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return `https://player.vimeo.com/video/${vm[1]}`;
  const gd = String(url).match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (gd) return `https://drive.google.com/file/d/${gd[1]}/preview`;
  return null;
}

  else if (m.tipo === 'video') player = `<div class="player"><video controls controlsList="nodownload" preload="metadata" src="${esc(safeURL(src))}"></video></div>`;
  else if (m.tipo === 'audio') player = `<div class="player audio-box">${ic('audio', 48)}<h3 style="color:#fff;margin-top:12px">${esc(m.titulo)}</h3><div style="color:#c6cbd8">${esc(m.disciplina || '')}</div><audio controls controlsList="nodownload" preload="metadata" src="${esc(safeURL(src))}"></audio></div>`;
  else player = `<div class="player"><iframe class="pdf-frame" src="${esc(safeURL(src))}" title="${esc(m.titulo)}"></iframe></div>`;

  main.innerHTML = `<div class="page">

  const link = linkAlunos(), g = store.gist;
  const { el } = modal('Link para os alunos', `<p>Envie este link pelo WhatsApp, e-mail ou grupo da turma. Cada aluno cria a conta e ganha ${diasTeste() ? `<b>${diasTeste()} dias grátis</b>` : 'acesso conforme o plano'}.</p>
    <div class="form"><input class="field" readonly value="${esc(link)}" id="lk"></div>
    <div class="actions"><a class="btn ghost" href="https://wa.me/?text=${encodeURIComponent('Acesse o portal ' + S.config.nomePortal + ' e ganhe acesso grátis: ' + link)}" target="_blank" rel="noopener">WhatsApp</a><button class="btn primary" id="cp">Copiar link</button></div>
    ${g && !CONFIG.gist?.id ? `<details style="margin-top:18px"><summary class="small" style="cursor:pointer;font-weight:600">Deixar o link mais curto (opcional)</summary>
      <p class="small muted" style="margin-top:8px">No arquivo <code>index.html</code> do seu repositório, preencha a linha abaixo. Assim o link fica só o endereço do site e o app instalado no celular sempre encontra o conteúdo.</p>
      <div class="form"><input class="field" readonly value="gist: { user: '${esc(g.user)}', id: '${esc(g.id)}' },"></div></details>` : ''}`);
  $('#cp', el).onclick = () => copiar(link);
  $('#lk', el).onclick = e => e.target.select();
}

function admCodigos(box, codigos) {
  codigos.sort(byNewest);
  const valido = c => !c.validoAte || new Date(c.validoAte + 'T23:59:59') >= Date.now();
  box.innerHTML = `<div class="list-h"><p class="muted" style="margin:0;max-width:640px">Depois de confirmar o pagamento, envie ao aluno um código. Ele digita o código em <b>Assinatura</b> e ganha os dias de acesso. Cada aluno usa cada código uma única vez.</p>
    <button class="btn primary sm" id="novo">${ic('plus', 15)} Gerar código</button></div>
    <div class="card table-wrap">${codigos.length ? `<table><tr><th>Identificação</th><th>Dias</th><th>Válido até</th><th>Criado</th><th>Situação</th><th></th></tr>
    ${codigos.map(c => `<tr><td><b>${esc(c.rotulo || 'Código')}</b><div class="small muted">${esc(c.dica || '')}</div></td><td>${esc(c.dias)}</td><td>${fmtDate(c.validoAte)}</td><td>${fmtDate(c.criadoEm)}</td><td>${valido(c) ? '<span class="badge ok">Válido</span>' : '<span class="badge err">Expirado</span>'}</td>
      <td><div class="acts"><button class="btn danger sm" data-del="${esc(c.id)}">Excluir</button></div></td></tr>`).join('')}</table>` : '<div class="empty"><h3>Nenhum código gerado</h3><p>Gere um código para cada turma, mês ou aluno.</p></div>'}</div>`;
  $('#novo').onclick = () => {
    const { el, close } = modal('Gerar código de acesso', `<form class="form" id="fg">
      <label>Identificação (para você)<input name="rotulo" required placeholder="Ex.: Turma 3º período — dezembro"></label>
      <div class="row2"><label>Dias de acesso<input name="dias" type="number" min="1" required value="${esc(S.config.diasAcesso)}"></label>
        <label>Pode ser usado até<input name="validoAte" type="date" required value="${isoIn(45)}"></label></div>
      <p class="hint">Um código pode ser enviado para um aluno ou para a turma toda. Depois da data limite, ele deixa de funcionar.</p>
      <div class="actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Gerar</button></div></form>`);
    $('#fg', el).onsubmit = async e => {
      e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); const b = $('button.primary', el); b.disabled = true;
      const code = novoCodigo();
      try {
        await store.save('codigos', { rotulo: d.rotulo.trim(), dias: Number(d.dias), validoAte: d.validoAte, hash: await hash(normCode(code), 'agora-codigo'), dica: code.slice(0, 4) + '••••' + code.slice(-2) });
        close();
        const m2 = modal('Código gerado', `<p>Envie este código ao aluno. <b>Copie agora:</b> por segurança, ele não aparece de novo.</p>
          <div style="font:700 2rem var(--sans);letter-spacing:.12em;text-align:center;padding:18px;background:#f3ead7;border-radius:12px;color:var(--ink)">${code}</div>
          <p class="hint" style="margin-top:10px">Vale ${esc(d.dias)} dias de acesso. Pode ser usado até ${fmtDate(d.validoAte)}.</p>
          <div class="actions"><button class="btn primary" id="cpc">Copiar código</button></div>`);
        $('#cpc', m2.el).onclick = () => copiar(code);
        m2.el.addEventListener('click', e => { if (e.target === m2.el || e.target.closest('[data-close]')) render(); });
      } catch (err) { toast(err.message, true); b.disabled = false; }
    };
  };
  box.querySelector('.table-wrap').onclick = async e => {
    const dl = e.target.closest('[data-del]');
    if (dl && await confirmar('Excluir este código? Alunos que já o usaram mantêm o acesso.', 'Excluir')) { try { await store.remove('codigos', dl.dataset.del); toast('Código excluído.'); render(); } catch (err) { toast(err.message, true); } }
  };
}

function admMateriais(box, mats) {
  mats.sort(byNewest);
  box.innerHTML = `<div class="list-h"><p class="muted" style="margin:0">Envie arquivos de vídeo, áudio e PDF ou cadastre links (YouTube, Vimeo, Google Drive).</p><button class="btn primary sm" id="novo">${ic('plus', 15)} Novo material</button></div>
    <div class="card table-wrap">${mats.length ? `<table><tr><th>Título</th><th>Tipo</th><th>Disciplina</th><th>Origem</th><th>Data</th><th></th></tr>
    ${mats.map(m => `<tr><td><b>${esc(m.titulo)}</b></td><td>${(TIPOS[m.tipo] || {}).nome || ''}</td><td>${esc(m.disciplina || '—')}</td><td class="small muted">${m.fileRef ? esc(m.fileName) + ' · ' + fmtSize(m.size) : 'Link externo'}</td><td>${fmtDate(m.criadoEm)}</td>
      <td><div class="acts"><a class="btn ghost sm" href="#/material/${encodeURIComponent(m.id)}">Ver</a><button class="btn ghost sm" data-ed="${esc(m.id)}">Editar</button><button class="btn danger sm" data-del="${esc(m.id)}">Excluir</button></div></td></tr>`).join('')}</table>` : '<div class="empty"><h3>Nenhum material ainda</h3><p>Clique em “Novo material” para publicar o primeiro.</p></div>'}</div>`;
  $('#novo').onclick = () => formMaterial();
  box.onclick = async e => {
    const ed = e.target.closest('[data-ed]'), dl = e.target.closest('[data-del]');
    if (ed) formMaterial(mats.find(m => m.id === ed.dataset.ed));
    if (dl && await confirmar('Excluir este material? O arquivo também será removido.', 'Excluir')) {
      const m = mats.find(x => x.id === dl.dataset.del);
      try { if (m.fileRef) await store.deleteFile(m.fileRef); await store.remove('materiais', m.id); toast('Material excluído.'); render(); } catch (err) { toast(err.message, true); }
    }
  };
}
function formMaterial(m = {}) {
  const { el, close } = modal(m.id ? 'Editar material' : 'Novo material', `<form class="form" id="fm">
    <label>Título<input name="titulo" required value="${esc(m.titulo)}"></label>
    <div class="row2"><label>Tipo<select name="tipo">${Object.entries(TIPOS).map(([k, t]) => `<option value="${k}" ${m.tipo === k ? 'selected' : ''}>${t.nome}</option>`).join('')}</select></label>
      <label>Disciplina<input name="disciplina" list="dl-disc" value="${esc(m.disciplina)}" placeholder="Ex.: Direito Civil"></label></div>
    <label>Descrição<textarea name="descricao" rows="3">${esc(m.descricao)}</textarea></label>
    <label>${store.modo === 'gist' ? 'Arquivo (PDF ou áudio, até 4 MB)' : 'Arquivo (vídeo, áudio ou PDF)'}<input type="file" name="arquivo" accept="video/*,audio/*,application/pdf"></label>
    ${store.modo === 'gist' ? '<p class="hint">Para vídeos, publique no YouTube (pode ser “não listado”) ou no Google Drive e cole o link abaixo.</p>' : ''}
    ${m.fileName ? `<p class="hint">Arquivo atual: <b>${esc(m.fileName)}</b>. Envie outro para substituir.</p>` : ''}
    <label>…ou link externo<input name="url" type="url" value="${esc(m.url)}" placeholder="https://youtube.com/watch?v=…"></label>
    <div class="progress hidden" id="pg"><span></span></div>
    <div class="actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="sv">Salvar</button></div>
  </form><datalist id="dl-disc">${DISCIPLINAS.map(d => `<option>${d}</option>`).join('')}</datalist>`);
  const f = $('#fm', el);
  f.arquivo.onchange = () => { const t = f.arquivo.files[0]?.type || ''; f.tipo.value = t.startsWith('video') ? 'video' : t.startsWith('audio') ? 'audio' : t === 'application/pdf' ? 'pdf' : f.tipo.value; };
  f.onsubmit = async e => {
    e.preventDefault();
    const file = f.arquivo.files[0], url = f.url.value.trim();
    if (!file && !url && !m.fileRef) return toast('Envie um arquivo ou informe um link.', true);
    $('#sv', el).disabled = true;
    const o = { ...m, titulo: f.titulo.value.trim(), tipo: f.tipo.value, disciplina: f.disciplina.value.trim(), descricao: f.descricao.value.trim(), url };
    try {
      if (file) {
        $('#pg', el).classList.remove('hidden');
        const r = await store.uploadFile(file, p => $('#pg span', el).style.width = Math.round(p * 100) + '%');
        if (m.fileRef) await store.deleteFile(m.fileRef);
        Object.assign(o, { fileRef: r, fileName: file.name, mime: file.type, size: file.size });
      }
      if (!o.fileRef) Object.assign(o, { fileRef: '', fileName: '', mime: '', size: 0 });
      await store.save('materiais', o);
      close(); toast('Material salvo.'); render();
    } catch (err) { toast(err.message, true); $('#sv', el).disabled = false; }
  };
}

function admPublicacoes(box, posts) {
  let filtro = '';
  const draw = () => {
    const l = posts.filter(p => !filtro || p.categoria === filtro).sort(byNewest);
    $('#ptab').innerHTML = l.length ? `<table><tr><th>Título</th><th>Categoria</th><th>Prazo / data</th><th>Publicado</th><th></th></tr>
      ${l.map(p => `<tr><td><b>${esc(p.titulo)}</b><div class="small muted">${esc(p.instituicao || '')}</div></td><td>${esc((CATS[p.categoria] || {}).nome)}</td><td>${fmtDate(p.prazo)}</td><td>${fmtDate(p.criadoEm)}</td>
      <td><div class="acts"><a class="btn ghost sm" href="#/publicacao/${encodeURIComponent(p.id)}">Ver</a><button class="btn ghost sm" data-ed="${esc(p.id)}">Editar</button><button class="btn danger sm" data-del="${esc(p.id)}">Excluir</button></div></td></tr>`).join('')}</table>` : '<div class="empty"><p>Nenhuma publicação nesta categoria.</p></div>';
  };
  box.innerHTML = `<div class="list-h"><div class="chips" id="pf">${[['', 'Todas'], ...Object.entries(CATS).map(([k, c]) => [k, c.plural])].map(([v, l]) => `<button class="chip ${v === '' ? 'on' : ''}" data-v="${v}">${l}</button>`).join('')}</div>
    <button class="btn primary sm" id="novo">${ic('plus', 15)} Nova publicação</button></div><div class="card table-wrap" id="ptab"></div>`;
  draw();
  $('#pf').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; filtro = b.dataset.v; $$('.chip', $('#pf')).forEach(x => x.classList.toggle('on', x === b)); draw(); };
  $('#novo').onclick = () => formPost({ categoria: filtro || 'estagio' });
  $('#ptab').onclick = async e => {
    const ed = e.target.closest('[data-ed]'), dl = e.target.closest('[data-del]');
    if (ed) formPost(posts.find(p => p.id === ed.dataset.ed));
    if (dl && await confirmar('Excluir esta publicação?', 'Excluir')) { try { await store.remove('publicacoes', dl.dataset.del); toast('Publicação excluída.'); render(); } catch (err) { toast(err.message, true); } }
  };
}
function formPost(p = {}) {
  const { el, close } = modal(p.id ? 'Editar publicação' : 'Nova publicação', `<form class="form" id="fp">
    <div class="row2"><label>Categoria<select name="categoria">${Object.entries(CATS).map(([k, c]) => `<option value="${k}" ${p.categoria === k ? 'selected' : ''}>${c.nome}</option>`).join('')}</select></label>
      <label><span id="lb-prazo">Prazo de inscrição</span><input type="date" name="prazo" value="${esc(p.prazo)}"></label></div>
    <label>Título<input name="titulo" required value="${esc(p.titulo)}"></label>
    <div class="row2"><label><span id="lb-inst">Instituição / órgão</span><input name="instituicao" value="${esc(p.instituicao)}"></label><label>Local / abrangência<input name="local" value="${esc(p.local)}" placeholder="Ex.: Recife/PE · Remoto"></label></div>
    <label>Resumo<input name="resumo" value="${esc(p.resumo)}" maxlength="220"></label>
    <label>Conteúdo completo<textarea name="conteudo" rows="7">${esc(p.conteudo)}</textarea></label>
    <label>Link oficial (edital, vaga ou texto da lei)<input type="url" name="link" value="${esc(p.link)}" placeholder="https://"></label>
    <div class="actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Publicar</button></div></form>`, { wide: true });
  const f = $('#fp', el);
  const lbl = () => { const lei = f.categoria.value === 'lei'; $('#lb-prazo', el).textContent = lei ? 'Data de publicação' : 'Prazo de inscrição'; $('#lb-inst', el).textContent = lei ? 'Norma (ex.: Lei nº …)' : 'Instituição / órgão'; };
  f.categoria.onchange = lbl; lbl();
  f.onsubmit = async e => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(f));
    try { await store.save('publicacoes', { ...p, ...d }); close(); toast('Publicação salva.'); render(); } catch (err) { toast(err.message, true); }
  };
}

function admAlunos(box, users) {
  users.sort(byNewest);
  box.innerHTML = `<div class="filters"><div class="search">${ic('search')}<input class="field" id="ub" placeholder="Buscar por nome ou e-mail…"></div></div><div class="card table-wrap" id="ut"></div>`;
  const draw = (t = '') => {
    const l = users.filter(u => `${u.nome} ${u.email}`.toLowerCase().includes(t.toLowerCase()));
    $('#ut').innerHTML = `<table><tr><th>Aluno</th><th>Instituição</th><th>Cadastro</th><th>Assinatura</th><th></th></tr>
    ${l.map(u => { const st = statusAss(u); const self = u.id === S.user.id; return `<tr><td><b>${esc(u.nome)}</b><div class="small muted">${esc(u.email)}${u.telefone ? ' · ' + esc(u.telefone) : ''}</div></td><td class="small">${esc(u.instituicao || '—')}<div class="muted">${esc(u.semestre || '')}</div></td><td>${fmtDate(u.criadoEm)}</td><td><span class="badge ${st.cls}">${esc(st.txt)}</span></td>
      <td><div class="acts">${u.role !== 'admin' ? `<button class="btn ghost sm" data-act="ativar" data-id="${esc(u.id)}">+${S.config.diasAcesso} dias</button>${ativo(u) ? `<button class="btn danger sm" data-act="cancelar" data-id="${esc(u.id)}">Cancelar</button>` : ''}` : ''}
      ${self ? '' : `<button class="btn ghost sm" data-act="role" data-id="${esc(u.id)}">${u.role === 'admin' ? 'Tornar aluno' : 'Tornar admin'}</button>`}</div></td></tr>`; }).join('')}</table>`;
  };
  draw();
  $('#ub').oninput = e => draw(e.target.value);
  $('#ut').onclick = async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const u = users.find(x => x.id === b.dataset.id);
    try {
      if (b.dataset.act === 'ativar') { await ativarAssinatura(u.id); toast(`Acesso de ${u.nome} estendido.`); }
      if (b.dataset.act === 'cancelar') { if (!await confirmar(`Cancelar a assinatura de ${u.nome}? O acesso será bloqueado imediatamente.`, 'Cancelar assinatura')) return; await store.updateUser(u.id, { assinatura: { ...u.assinatura, status: 'cancelada', validade: Date.now() } }); toast('Assinatura cancelada.'); }
      if (b.dataset.act === 'role') { const nr = u.role === 'admin' ? 'aluno' : 'admin'; if (!await confirmar(`Alterar ${u.nome} para ${nr}?`)) return; await store.updateUser(u.id, { role: nr }); toast('Perfil atualizado.'); }
      render();
    } catch (err) { toast(err.message, true); }
  };
}
function admPagamentos(box, pags) {
  pags.sort(byNewest);
  box.innerHTML = `<div class="card table-wrap">${pags.length ? `<table><tr><th>Data</th><th>Aluno</th><th>Método</th><th>Valor</th><th>Status</th><th></th></tr>
    ${pags.map(p => `<tr><td>${fmtDate(p.criadoEm)}</td><td><b>${esc(p.nome)}</b><div class="small muted">${esc(p.email)}</div></td><td>${esc({ pix: 'Pix', cartao: 'Cartão', boleto: 'Boleto' }[p.metodo] || p.metodo)}</td><td>${brl(p.valor)}</td><td>${pagBadge(p.status)}</td>
    <td><div class="acts">${p.status === 'pendente' ? `<button class="btn primary sm" data-ok="${esc(p.id)}">Confirmar e liberar</button><button class="btn danger sm" data-no="${esc(p.id)}">Recusar</button>` : ''}</div></td></tr>`).join('')}</table>` : '<div class="empty"><h3>Nenhum pagamento registrado</h3></div>'}</div>
    <p class="hint" style="margin-top:12px">Ao confirmar um pagamento pendente, o acesso do aluno é liberado por ${S.config.diasAcesso} dias. Para automatizar, configure o webhook do seu gateway (veja o README).</p>`;
  box.onclick = async e => {
    const ok = e.target.closest('[data-ok]'), no = e.target.closest('[data-no]');
    const p = pags.find(x => x.id === (ok || no)?.dataset[ok ? 'ok' : 'no']); if (!p) return;
    try {
      if (ok) { await store.save('pagamentos', { ...p, status: 'aprovado' }); await ativarAssinatura(p.userId); toast('Pagamento confirmado e acesso liberado.'); }
      else { await store.save('pagamentos', { ...p, status: 'recusado' }); toast('Pagamento recusado.'); }
      render();
    } catch (err) { toast(err.message, true); }
  };
}
function admConfig(box) {
  const c = S.config;
  box.innerHTML = `<div class="card pad" style="max-width:760px"><form class="form" id="fc">
    <label>Nome do portal<input name="nomePortal" required value="${esc(c.nomePortal)}"></label>
    <div class="row2"><label>Nome do plano<input name="planoNome" required value="${esc(c.planoNome)}"></label><label>Mensalidade (R$)<input name="preco" type="number" step="0.01" min="0" required value="${esc(c.preco)}"></label></div>
    <div class="row2"><label>Dias de acesso por pagamento<input name="diasAcesso" type="number" min="1" required value="${esc(c.diasAcesso)}"></label><label>Dias grátis para novos alunos<input name="diasTeste" type="number" min="0" required value="${esc(c.diasTeste)}"><span class="hint">Use 0 para não oferecer período grátis.</span></label></div>
    <div class="row2"><label>Chave Pix (opcional)<input name="chavePix" value="${esc(c.chavePix)}"></label><label>Contato para enviar comprovante<input name="contato" value="${esc(c.contato)}" placeholder="WhatsApp ou e-mail"></label></div>
    <label>Link de pagamento (Mercado Pago, PagSeguro, Stripe…)<input name="linkPagamento" type="url" value="${esc(c.linkPagamento)}" placeholder="https://"></label>
    <label>Instruções de pagamento<textarea name="instrucoesPagamento" rows="3">${esc(c.instrucoesPagamento)}</textarea></label>
    <div class="actions"><button class="btn primary">Salvar configurações</button></div>
    <p class="hint">Banco de dados em uso: <b>${store.modo === 'local' ? 'IndexedDB (local, neste navegador)' : store.modo === 'gist' ? `GitHub Gist de @${esc(store.gist?.user)}` : 'Firebase Firestore + Storage (nuvem)'}</b>.
    ${store.modo === 'gist' ? ` <a href="https://gist.github.com/${esc(store.gist?.user)}/${esc(store.gist?.id)}" target="_blank" rel="noopener">Abrir o Gist</a>. As alterações podem levar alguns minutos para aparecer para os alunos.` : ''}</p>
  </form></div>`;
  $('#fc').onsubmit = async e => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
    const n = { ...c, ...d, preco: Number(d.preco), diasAcesso: Number(d.diasAcesso), diasTeste: Number(d.diasTeste) };
    try { await store.saveConfig(n); S.config = n; toast('Configurações salvas.'); render(); } catch (err) { toast(err.message, true); }
  };
}

/* ================================ Boot ================================ */
(async function boot() {
  try {
    store = CONFIG.backend === 'firebase' ? await FirebaseStore() : CONFIG.backend === 'gist' ? GistStore() : LocalStore();
    await store.init();
    S.config = await store.getConfig();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="auth"><div class="card"><h2>Não foi possível iniciar</h2><p class="muted">${esc(e.message)}</p><p class="small">${CONFIG.backend === 'firebase' ? 'Verifique as credenciais do Firebase em CONFIG.' : 'Seu navegador precisa permitir IndexedDB (desative a navegação anônima restrita).'}</p></div></div>`;
    return;
  }
  if (isStandalone()) document.documentElement.classList.add('standalone');
  fixarLinkGist();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    try { navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e)); } catch (e) { console.warn(e); }
  }
  window.addEventListener('hashchange', render);
  let wasMobile = isMobile();
  window.addEventListener('resize', () => { if (isMobile() !== wasMobile) { wasMobile = isMobile(); render(); } });
  render();
})();
</script>
</body>
</html>
