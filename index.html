function go(h) { const t = '#/' + h; if (location.hash === t) render(); else location.hash = t; }

async function render() {
  S.limpar.splice(0).forEach(f => { try { f(); } catch {} });
  revokeURLs(); S.navCount++;
  const [path, qs] = location.hash.replace(/^#\/?/, '').split('?');
  const [name = '', param] = path.split('/');
  const q = new URLSearchParams(qs || '');
  const r = ROUTES[name] || ROUTES[''];
  try { S.user = await store.currentUser(); } catch (e) { console.error(e); S.user = null; }
  if (S.user && S.sessaoReg !== S.user.id) { S.sessaoReg = S.user.id; registrar('sessao'); }
  if (r.auth && !S.user) return go('entrar');
  if (r.guest && S.user) return go('painel');
  if (name === '' && S.user) return go('painel');
  if (r.admin && S.user?.role !== 'admin') return go('painel');
  if (r.ativo && !ativo(S.user)) { toast('Assine o portal para acessar este conteúdo.'); return go('assinar'); }

  const app = $('#app');
  if (store.modo === 'gist' && !store.configurado && S.user?.role !== 'admin' && name !== 'configurar') {
    if (S.user) { await store.logout(); S.user = null; }
    app.innerHTML = publicHTML('setup'); bindShell(); await viewIndisponivel($('#main')); return;
  }
  if (r.avulsa) {
    app.innerHTML = '<main id="main" class="ed-root"></main>';
    const m = $('#main'); m.innerHTML = '<div class="loading">Abrindo o seu espaço de colunista…</div>';
    try { await r.view(m, param, q); } catch (e) { console.error(e); m.innerHTML = `<div class="ed-falha"><div class="card pad"><h2>Não foi possível abrir</h2><p class="muted">${esc(e.message)}</p></div></div>`; }
    window.scrollTo(0, 0); return;
  }
  app.innerHTML = S.user ? shellHTML(name) : publicHTML(name);
  const main = $('#main');
  main.innerHTML = '<div class="loading">Carregando…</div>';
  bindShell();
  try { await r.view(main, param, q); bindInstall(); capasAutomaticas(); }
  catch (e) { console.error(e); main.innerHTML = `<div class="page"><div class="card empty"><h3>Não foi possível carregar</h3><p>${esc(e.message)}</p></div></div>`; }
  window.scrollTo(0, 0);
}

function trocarGistModal() {

  const { el, close } = modal('Trocar o Gist de dados', `<form class="form" id="ftg">

    <div class="actions"><button type="button" class="btn danger" id="desc">Desconectar</button><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Conectar</button></div></form>`);
  $('#ftg', el).onsubmit = async e => {
    e.preventDefault();
    try { await store.definirGist(e.target.g.value); close(); S.config = await store.getConfig(); fixarLinkGist(); toast('Gist alterado.'); render(); }
    catch (err) { toast(err.message, true); }
  };
  $('#desc', el).onclick = async () => {
    if (!await confirmar('Desconectar este navegador do Gist? Nada é apagado no GitHub.', 'Desconectar')) return;
    await store.desconectarGist(); close();
    try { history.replaceState(null, '', location.pathname + '#/'); } catch {}
    go('');
  };
}
function fixarLinkGist() {
  if (store.modo !== 'gist' || !store.gist || CONFIG.gist?.id) return;
  const q = new URLSearchParams(location.search), v = `${store.gist.user}/${store.gist.id}`;
  if (q.get('gist') === v) return;
  q.set('gist', v);
  try { history.replaceState(null, '', location.pathname + '?' + q.toString().replace('%2F', '/') + location.hash); } catch {}
}

function embedURL(url) {
  url = String(url || '');
  const yt = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
  const vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return `https://player.vimeo.com/video/${vm[1]}`;
  const gd = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{10,})/);
  if (gd) return `https://drive.google.com/file/d/${gd[1]}/preview`;
  return null;
}
const fonteMidia = url => /youtube\.com|youtu\.be/.test(url) ? 'youtube' : /drive\.google\.com/.test(url) ? 'drive' : null;
function validarMidia(url) {
  url = String(url || '').trim();
  if (!url) return 'Cole o link do YouTube ou do Google Drive.';
  if (!fonteMidia(url) || !embedURL(url)) return 'Use um link do YouTube (youtube.com ou youtu.be) ou do Google Drive (drive.google.com/file/d/…).';
  return null;
}
function midiaPlayer(url, formato, titulo = '', sub = '') {

  const allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';

  return `<div class="player embed"><iframe src="${esc(emb)}" allow="${allow}" allowfullscreen title="${esc(titulo)}"></iframe></div>`;
}

/* ============================ Leitor de PDF ============================
   Mostra as páginas na largura da tela, com zoom, tela cheia e retomada
   da leitura. Só as páginas perto da tela ficam desenhadas (economiza memória). */
const ZOOMS = [1, 1.25, 1.5, 2, 2.5, 3];
async function montarLeitor(box, src, m) {
  const chave = 'agora-pg-' + m.id;
  box.innerHTML = `<div class="leitor" id="leitor">
    <div class="lt-bar">
      <button class="icon-btn" data-a="fechar" aria-label="Sair da tela cheia">${ic('back', 20)}</button>
      <span class="lt-pg" aria-live="polite">Página <b id="lt-n">1</b> de <span id="lt-t">…</span></span>
      <div class="lt-zoom"><button data-a="menos" aria-label="Diminuir zoom">−</button><span id="lt-z">Ajustado</span><button data-a="mais" aria-label="Aumentar zoom">+</button></div>
      <button class="icon-btn" data-a="cheia" aria-label="Ler em tela cheia" title="Tela cheia">${ic('expand', 19)}</button>
    </div>
    <div class="lt-pages" id="lt-pages"><div class="loading" style="color:#dfe3ea;width:100%">Abrindo o PDF…</div></div>
  </div>`;
  const L = $('#leitor', box), cont = $('#lt-pages', box);
  let doc;
  try { const pdfjs = await carregarPdfJs(); doc = await pdfjs.getDocument({ url: src, isEvalSupported: false }).promise; }
  catch (e) {
    console.warn('Leitor indisponível; usando o visualizador do navegador.', e);
    cont.innerHTML = `<div class="loading" style="color:#dfe3ea;width:100%;text-align:center;padding:40px 20px">Não foi possível abrir o leitor agora. Verifique a conexão e recarregue a página.</div>`;
    return;
  }
  const n = doc.numPages; $('#lt-t', box).textContent = n;
  let zi = 0, ratio = 1.414, atual = 1;
  const p1 = await doc.getPage(1); { const v = p1.getViewport({ scale: 1 }); ratio = v.height / v.width; }
  const razoes = new Map([[1, ratio]]);
  const largura = () => Math.min(cont.clientWidth - (isMobile() ? 12 : 20), isMobile() ? 9999 : 920) * ZOOMS[zi];
  cont.innerHTML = Array.from({ length: n }, (_, i) => `<div class="lt-page" data-i="${i + 1}"><span class="lt-ph">${i + 1}</span></div>`).join('');
  const pags = $$('.lt-page', cont);
  const desenhadas = new Map(); // página -> tarefa
  const dimensionar = () => { const w = largura(); pags.forEach(el => { const r = razoes.get(+el.dataset.i) || ratio; el.style.width = w + 'px'; el.style.height = Math.round(w * r) + 'px'; }); };
  const apagar = i => { const el = pags[i - 1], cv = el.querySelector('canvas'); if (cv) { cv.width = 0; cv.height = 0; cv.remove(); } desenhadas.delete(i); };
  async function desenhar(i) {
    if (desenhadas.has(i)) return;
    const el = pags[i - 1], w = largura(); desenhadas.set(i, w);
    try {
      const pg = i === 1 ? p1 : await doc.getPage(i), v1 = pg.getViewport({ scale: 1 });
      if (!razoes.has(i)) { razoes.set(i, v1.height / v1.width); el.style.height = Math.round(w * v1.height / v1.width) + 'px'; }
      const dpr = Math.min(window.devicePixelRatio || 1, 2), vp = pg.getViewport({ scale: (w / v1.width) * dpr });
      const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      if (desenhadas.get(i) !== w) return; // zoom mudou durante o desenho
      el.querySelector('canvas')?.remove(); el.appendChild(cv);
      // mantém no máximo 8 páginas desenhadas: libera as mais distantes
      if (desenhadas.size > 8) [...desenhadas.keys()].sort((a, b) => Math.abs(b - atual) - Math.abs(a - atual)).slice(0, desenhadas.size - 8).forEach(apagar);
    } catch (e) { desenhadas.delete(i); console.warn(e); }
  }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) desenhar(+e.target.dataset.i); }), { root: cont, rootMargin: '800px 0px' });
  dimensionar(); pags.forEach(el => io.observe(el));
  const paginaAtual = () => { const y = cont.scrollTop + cont.clientHeight / 3; let k = 1; for (const el of pags) { if (el.offsetTop <= y) k = +el.dataset.i; else break; } return k; };
  let tSalva;
  cont.addEventListener('scroll', () => {
    const k = paginaAtual(); if (k !== atual) { atual = k; $('#lt-n', box).textContent = k; clearTimeout(tSalva); tSalva = setTimeout(() => lsSet(chave, String(k)), 400); }
    const r = $('.lt-retomar', L); if (r && cont.scrollTop > 40) r.remove();
  }, { passive: true });
  const irPara = k => { const el = pags[k - 1]; if (el) cont.scrollTop = el.offsetTop - 8; };
  const zoom = d => {
    const ni = Math.max(0, Math.min(ZOOMS.length - 1, zi + d)); if (ni === zi) return;
    const frac = cont.scrollTop / Math.max(1, cont.scrollHeight), fx = cont.scrollLeft / Math.max(1, cont.scrollWidth);
    zi = ni; [...desenhadas.keys()].forEach(apagar); dimensionar();
    cont.scrollTop = frac * cont.scrollHeight; cont.scrollLeft = fx * cont.scrollWidth;
    $('#lt-z', box).textContent = zi === 0 ? 'Ajustado' : Math.round(ZOOMS[zi] * 100) + '%';
    $('[data-a=menos]', box).disabled = zi === 0; $('[data-a=mais]', box).disabled = zi === ZOOMS.length - 1;
    pags.forEach(el => { io.unobserve(el); io.observe(el); });
  };
  $('[data-a=menos]', box).disabled = true;
  const cheia = on => {

const hojeISO = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  if (!r.ok) {

      : r.status === 429 ? 'Limite de uso da API atingido. Aguarde um minuto e tente de novo.'

async function textoCompletoPDF(blob, onStatus) {

  let out = '';

}
const PROMPT_SISTEMA = `Você é professor de Direito em uma faculdade brasileira e examinador experiente de provas da OAB e de concursos jurídicos. Elabora questões de múltipla escolha de nível acadêmico, rigorosas e corretas, em português do Brasil.`;

function validarQuestoes(txt) {

  let bloco;
  if (mat.texto.replace(/\[Página \d+\]/g, '').trim().length >= Math.max(400, mat.paginas * 60)) {
    bloco = { type: 'text', text: `${cab}\n<material>\n${mat.texto}\n</material>`, cache_control: { type: 'ephemeral' } };
  } else {
    if (blob.size > 30 * 1024 * 1024) throw new Error('Este PDF parece escaneado (sem texto) e é grande demais para a IA ler como imagem. Use uma versão do PDF com texto.');

    const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });

  const temas = existentes.map(q => q.tema || q.enunciado.slice(0, 80));

    const n = Math.min(10, total - feitas);
    onStatus?.(`A IA está elaborando as questões ${feitas + 1} a ${feitas + n} de ${total}… (pode levar até 1 minuto)`);
    const r = await chamarClaude({ system: PROMPT_SISTEMA, maxTokens: 12000, content: [bloco, { type: 'text', text: promptQuestoes(n, nivel, [...temas, ...novas.map(q => q.tema || q.enunciado.slice(0, 80))]) }] });

/* ============================ Quiz do aluno ============================ */
const notaMin = () => Number(S.config.notaMinima ?? 60);
const minCert = () => Number(S.config.quizMinCert ?? 10);
const embaralhar = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
async function viewQuiz(main, sub) {

  const discs = Object.entries(porDisc).sort((a, b) => a[0].localeCompare(b[0]));

  main.innerHTML = `<div class="page">

    ${hist.length ? `<div class="stats qz-resumo">

    ${discs.length ? `

function quizRodar(main) {

      <div class="progress" style="margin-bottom:18px"><span style="width:${(Q.i + 1) / n * 100}%"></span></div>

function pdfDeJPEG(jpeg, wPx, hPx, titulo) {
  const enc = new TextEncoder(), partes = [], off = []; let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; partes.push(b); len += b.length; };

  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4, () => { push(`<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`); push(jpeg); push('\nendstream'); });
  const cmd = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(5, () => push(`<< /Length ${cmd.length} >>\nstream\n${cmd}\nendstream`));
  obj(6, () => push(`<< /Title (${ascii(titulo)}) /Producer (Instituto Agora de Estudos Juridicos) >>`));
  const x = len;
  push(`xref\n0 7\n0000000000 65535 f \n${[1, 2, 3, 4, 5, 6].map(n => String(off[n]).padStart(10, '0') + ' 00000 n \n').join('')}trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${x}\n%%EOF`);
  return new Blob(partes, { type: 'application/pdf' });
}

const CertDB = (() => {
  let p;

    const r = indexedDB.open('agora-certificados', 1);
    r.onupgradeneeded = () => { const st = r.result.createObjectStore('certs', { keyPath: 'id' }); st.createIndex('uid', 'uid'); };
    r.onsuccess = () => res(r.result); r.onerror = () => { p = null; rej(r.error); };
  }));
  const tx = async (modo, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('certs', modo); const rq = fn(t.objectStore('certs')); t.oncomplete = () => res(rq?.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Sem espaço no aparelho.')); }); };

function ligarFiltroLeis(root, onChange) {
  const st = { q: '', tipo: '', disc: '', origem: '' };

  const t = $('#lf-t', root); if (t) t.onchange = () => { st.tipo = t.value; atualiza(); };
  const d = $('#lf-d', root); if (d) d.onchange = () => { st.disc = d.value; atualiza(); };

      `${m.length ? `<div class="list-h"><h3>Materiais <span class="badge">${m.length}</span></h3></div><div class="mgrid" style="margin-bottom:26px">${m.map(matCard).join('')}</div>` : ''}

/* ============================== Análises ============================== */
function agregar(users) {
  const ag = { views: {}, downloads: {}, pubs: {}, disp: {}, cols: {}, dias: {}, ativosDia: {}, sessoes: 0 };
  for (const u of users) {
    if (u.role === 'admin') continue; const a = u.atividade || {};
    for (const k of ['views', 'downloads', 'pubs', 'disp', 'cols']) for (const [x, n] of Object.entries(a[k] || {})) ag[k][x] = (ag[k][x] || 0) + n;
    for (const [d, n] of Object.entries(a.dias || {})) { ag.dias[d] = (ag.dias[d] || 0) + n; ag.ativosDia[d] = (ag.ativosDia[d] || 0) + 1; }
    ag.sessoes += a.sessoes || 0;
  }
  return ag;
}
const fmtN = n => Number(n || 0).toLocaleString('pt-BR');
const diasPeriodo = n => Array.from({ length: n }, (_, i) => hojeISO(new Date(Date.now() - (n - 1 - i) * DAY)));
function graficoColunas(serie, rotulo) {
  const max = Math.max(1, ...serie.map(x => x.v));
  const passo = max <= 4 ? 1 : Math.pow(10, Math.floor(Math.log10(max / 2))) * ([1, 2, 5].find(k => max / (Math.pow(10, Math.floor(Math.log10(max / 2))) * k) <= 4) || 10);
  const topo = Math.ceil(max / passo) * passo, linhas = [];
  for (let v = passo; v <= topo; v += passo) linhas.push(v);
  const cada = Math.ceil(serie.length / 6);
  return `<div class="cols-chart" role="img" aria-label="${esc(rotulo)}">
      ${linhas.map(v => `<div class="gl" style="bottom:${v / topo * 100}%"><span>${fmtN(v)}</span></div>`).join('')}<div class="gl" style="bottom:0;border:0"><span>0</span></div>
      ${serie.map(x => `<div class="c" tabindex="0" data-tip="${esc(x.tip)}"><i style="height:${x.v / topo * 100}%"></i></div>`).join('')}

function repoDoSite(cfg) {

  const m = location.hostname.match(/^([\w-]+)\.github\.io$/i); if (!m) return null;
  const seg = location.pathname.split('/').filter(Boolean)[0];

async function aplicarNormas(m, normas, erros, via) {

async function sincronizarLeisAgora(btn) {

  let motivo = '';

    const m = await import('./leis-sync.mjs');
    const { normas, erros } = await m.buscarNormas({ tipos: cfg.tipos });
    if (!normas.length && erros.length) throw new Error(erros.join('; '));
    btn.innerHTML = 'Publicando…';
    const r = await aplicarNormas(m, normas, erros, 'painel');
    fim(); toast(r.novas.length ? (r.novas.length > 1 ? `${r.novas.length} atualizações da lei publicadas.` : '1 atualização da lei publicada.') : 'Tudo em dia: nenhuma norma nova no Senado.'); render(); return;
  } catch (e) { motivo = e.cors ? '' : e.message; console.warn('[leis] navegador:', e); }

  fim();
  const link = linkActions(cfg);
  modal('Sincronizar pelo GitHub', `<p>O navegador não conseguiu consultar o portal do Senado diretamente${motivo ? ` <span class="muted small">(${esc(motivo)})</span>` : ''}. Isso é normal: alguns portais oficiais bloqueiam o acesso direto de sites.</p>

/* =================== Colunistas e Painel Colaborativo Acadêmico ===================
   - O administrador cadastra o professor e gera um LINK PESSOAL (#/escrever/<chave>).
   - O professor abre o link, escreve no editor online (salvamento automático) e clica
     em "Salvar e publicar no painel". O texto aparece para os alunos em #/academico.
   - Só o resumo (hash) da chave fica nos dados do portal; o link em si não é guardado.
   - Cada colunista tem um arquivo próprio (coluna-<id>.json): texto, rascunhos e perfil.
   =============================================================================== */
const COL_OK = new Set(['P', 'BR', 'B', 'I', 'U', 'S', 'SUB', 'SUP', 'H2', 'H3', 'BLOCKQUOTE', 'UL', 'OL', 'LI', 'A', 'HR']);
const COL_FORA = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'TEMPLATE', 'META', 'LINK', 'TITLE', 'HEAD', 'SVG', 'MATH', 'NOSCRIPT', 'BUTTON', 'INPUT', 'SELECT', 'TEXTAREA', 'IMG', 'PICTURE', 'VIDEO', 'AUDIO', 'CANVAS', 'FORM', 'XML']);
const COL_BLOCOS = 'p,div,h1,h2,h3,h4,h5,h6,ul,ol,blockquote,table,li,section,article';
/* Deixa só a formatação permitida (vale para o que é digitado, colado do Word/Google Docs e exibido) */
function limparHTML(html) {
  const t = document.createElement('template'); t.innerHTML = String(html || '');
  const out = document.createElement('div');
  const walk = (src, dst) => {
    for (const n of [...src.childNodes]) {
      if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); continue; }
      if (n.nodeType !== 1) continue;
      let tag = n.tagName.toUpperCase();
      if (COL_FORA.has(tag) || tag.includes(':')) continue;
      const st = (n.getAttribute('style') || '').toLowerCase();
      if (['DIV', 'SECTION', 'ARTICLE', 'TR', 'CENTER', 'PRE', 'ADDRESS', 'FIGURE', 'MAIN', 'HEADER', 'FOOTER'].includes(tag)) tag = n.querySelector(COL_BLOCOS) ? '' : 'P';
      else if (tag === 'H1') tag = 'H2';
      else if (/^H[4-6]$/.test(tag)) tag = 'H3';
      else if (tag === 'STRONG') tag = 'B';
      else if (tag === 'EM') tag = 'I';
      else if (tag === 'STRIKE' || tag === 'DEL') tag = 'S';
      else if (tag === 'LI' && !(dst.closest && dst.closest('ul,ol'))) tag = 'P';
      if (tag === 'B' && /font-weight:\s*(normal|[1-4]00)/.test(st)) tag = '';
      // blocos dentro de parágrafo viram quebra de linha (evita <p> dentro de <p>)
      if (/^(P|H2|H3|BLOCKQUOTE|UL|OL)$/.test(tag) && dst.closest && dst.closest('p,h2,h3')) {
        walk(n, dst); dst.appendChild(document.createElement('br')); continue;
      }
      if (!COL_OK.has(tag)) {
        let alvo = dst;
        if (tag === 'SPAN') for (const [ok, tg] of [[/font-weight:\s*(bold|[6-9]00)/.test(st), 'B'], [/font-style:\s*italic/.test(st), 'I'], [/text-decoration[^;]*underline/.test(st), 'U']]) {
          if (ok) { const e = document.createElement(tg); alvo.appendChild(e); alvo = e; }
        }
        walk(n, alvo);
        if (tag === 'TD' || tag === 'TH') alvo.appendChild(document.createTextNode(' '));
        continue;
      }
      const el = document.createElement(tag);
      if (tag === 'A') {
        const h = (n.getAttribute('href') || '').trim();
        if (!/^(https?:\/\/|mailto:)/i.test(h)) { walk(n, dst); continue; }
        el.setAttribute('href', h); el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener nofollow');
      }
      if (tag !== 'BR' && tag !== 'HR') walk(n, el);
      dst.appendChild(el);
    }
  };
  walk(t.content, out);
  out.querySelectorAll('b,i,u,s,sub,sup,a').forEach(e => { if (!e.textContent.trim() && !e.querySelector('br')) e.replaceWith(...e.childNodes); });
  // texto solto no nível de cima vai para dentro de um parágrafo
  const fim = document.createElement('div'); let p = null;
  for (const n of [...out.childNodes]) {
    if (n.nodeType === 1 && /^(P|H2|H3|BLOCKQUOTE|UL|OL|HR)$/.test(n.tagName)) { p = null; fim.appendChild(n); continue; }
    if (!p && ((n.nodeType === 3 && !n.nodeValue.trim()) || n.nodeName === 'BR')) continue;
    if (!p) { p = document.createElement('p'); fim.appendChild(p); }
    p.appendChild(n);
  }
  const vazio = e => /^(P|H2|H3|BLOCKQUOTE)$/.test(e.tagName) && !e.textContent.trim();
  let ant = false;
  for (const e of [...fim.children]) { const v = vazio(e); if (v && ant) e.remove(); ant = v; }
  while (fim.firstElementChild && vazio(fim.firstElementChild)) fim.firstElementChild.remove();
  while (fim.lastElementChild && vazio(fim.lastElementChild)) fim.lastElementChild.remove();
  return fim.innerHTML.trim();
}
const textoDe = html => { const t = document.createElement('template'); t.innerHTML = String(html || '').replace(/<\/(p|h2|h3|li|blockquote)>/gi, '$& ').replace(/<br\s*\/?>/gi, ' '); return t.content.textContent.replace(/\s+/g, ' ').trim(); };
const contarPalavras = html => (textoDe(html).match(/\S+/g) || []).length;
const minLeitura = html => Math.max(1, Math.round(contarPalavras(html) / 200));
const resumoDe = (html, n = 180) => { const t = textoDe(html); return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t; };
const fotoOk = f => typeof f === 'string' && /^data:image\/(png|jpe?g|webp);base64,[\w+/=]+$/.test(f);

}
async function fotoQuadrada(file, lado = 240) {

}
function novaChaveColunista() { const A = 'abcdefghijkmnpqrstuvwxyz23456789', r = crypto.getRandomValues(new Uint8Array(24)); return [...r].map(n => A[n % A.length]).join(''); }
const hashChaveCol = t => sha256hex('agora-colunista:' + String(t).trim());
const linkColunista = chave => linkAlunos() + '#/escrever/' + chave;
/* Perfil exibido = cadastro do administrador + o que o próprio professor completou */
function perfilColunista(c, coluna) {
  const p = coluna?.perfil || {}, r = { ...c };
  for (const k of ['titulacao', 'instituicao', 'bio']) if (String(p[k] || '').trim()) r[k] = String(p[k]).trim();
  if (fotoOk(p.foto)) r.foto = p.foto;
  return r;
}
function mesclarColuna(a, b, id) {
  a = a || {}; b = b || {};
  const exc = [...new Set([...(a.excluidos || []), ...(b.excluidos || [])])];
  const m = new Map();
  for (const x of [...(a.artigos || []), ...(b.artigos || [])]) { const y = m.get(x.id); if (!y || (x.atualizadoEm || 0) > (y.atualizadoEm || 0)) m.set(x.id, x); }
  const pa = a.perfil || {}, pb = b.perfil || {};
  return {
    id, perfil: (pb.at || 0) > (pa.at || 0) ? pb : pa, excluidos: exc.slice(-300),
    artigos: [...m.values()].filter(x => !exc.includes(x.id)).sort((x, y) => (y.atualizadoEm || 0) - (x.atualizadoEm || 0)),
    atualizadoEm: Math.max(a.atualizadoEm || 0, b.atualizadoEm || 0)

}
/* Tudo que está publicado no painel, do mais recente para o mais antigo */
async function carregarAcademico() {
  const [cols, colunas] = await Promise.all([store.list('colunistas'), store.list('colunas')]);
  const porId = new Map(colunas.map(c => [c.id, c]));
  const autores = cols.map(c => perfilColunista(c, porId.get(c.id)));
  const artigos = [];
  for (const a of autores) for (const x of (porId.get(a.id)?.artigos || [])) {
    if (!x.publicado || (a.ocultos || []).includes(x.id)) continue;
    artigos.push({ ...x.publicado, id: x.id, autor: a });
  }
  artigos.sort((x, y) => (y.publicadoEm || 0) - (x.publicadoEm || 0));
  return { autores, artigos, porId };
}
const assinaturaAcad = d => d.artigos.map(a => a.id + ':' + (a.atualizadoEm || 0)).join('|');

    ${dest ? `<span class="col-aspas">${ic('quote', 30)}</span>` : ''}

}
function artigoHTML(a, autor) {
  const atualizado = a.atualizadoEm && a.publicadoEm && a.atualizadoEm - a.publicadoEm > 3600000;
  const sub = [autor.titulacao, autor.instituicao].filter(Boolean).join(' · ');

  </article>`;
}

    modal('Pré-visualização: como os alunos vão ver', `<div class="doc col-folha">${artigoHTML({ ...a, html: corpo.innerHTML, publicadoEm: a.publicado?.publicadoEm || Date.now(), atualizadoEm: Date.now() }, autor())}</div>`, { wide: true });

    gravarLocal(); lsSet(KP, '1'); clearTimeout(tSync); tSync = null;

      <div class="actions"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary">Salvar perfil</button></div></form>`);
    let foto = fotoOk(col.perfil?.foto) ? col.perfil.foto : (fotoOk(c0.foto) ? c0.foto : '');
    $('#pf-file', el).onchange = async e => { try { foto = await fotoQuadrada(e.target.files[0]); $('#pf-av', el).innerHTML = avatarCol({ nome: c0.nome, foto }, 84); } catch (er) { toast(er.message, true); } };

    $('#fpf', el).onsubmit = async e => {
      e.preventDefault(); const f = e.target;
      col.perfil = { titulacao: f.titulacao.value.trim(), instituicao: f.instituicao.value.trim(), bio: f.bio.value.trim(), foto, at: Date.now() };
      gravarLocal(); lsSet(KP, '1'); close(); desenharRodape();
      if (await sincronizar()) toast('Perfil salvo.');
    };
  };
  const teclas = e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); lsSet(KP, '1'); sincronizar().then(ok => ok && toast('Salvo na nuvem.')); } };
  document.addEventListener('keydown', teclas);
  const aoSair = () => { if (document.visibilityState === 'hidden' && lsGet(KP) === '1') { gravarLocal(); sincronizar(); } };
  document.addEventListener('visibilitychange', aoSair);
  const antesDeFechar = () => { const x = art(); if (x && corpo.dataset.mexeu) x.html = limparHTML(corpo.innerHTML); gravarLocal(); if (lsGet(KP) === '1') sincronizar(); };
  window.addEventListener('beforeunload', antesDeFechar);
  S.limpar.push(() => {
    clearTimeout(tSync); clearTimeout(tLocal); gravarLocal(); if (lsGet(KP) === '1') sincronizar();
    document.removeEventListener('selectionchange', estadoTools); document.removeEventListener('keydown', teclas);
    document.removeEventListener('visibilitychange', aoSair); window.removeEventListener('beforeunload', antesDeFechar);
  });

  abrir(atual);
  if (lsGet(KP) === '1') { status('local'); agendarSync(3000); } else status(nuvem || !col.artigos.some(a => !vazioArt(a)) ? 'ok' : 'local');
  document.title = `Espaço do colunista · ${S.config.nomePortal}`;
  if (!tit.value) tit.focus();
}

function mostrarLinkColunista(c, chave) {
  const link = linkColunista(chave);
  const msg = `Olá, ${c.nome.split(' ')[0]}! Este é o seu link pessoal para escrever artigos no Painel colaborativo acadêmico do portal ${S.config.nomePortal}. Abra no computador ou no celular, escreva e clique em "Salvar e publicar no painel". Guarde o link e não o compartilhe: ele é a sua chave de acesso.\n\n${link}`;
  const { el } = modal('Link do colunista', `<p>Envie este link para <b>${esc(c.nome)}</b>. Ele abre o editor online direto, sem criar conta.</p>
    <div class="form"><input class="field" readonly value="${esc(link)}" id="lc"></div>
    <div class="actions" style="justify-content:flex-start"><button class="btn primary" id="lc-cp">Copiar link</button><a class="btn ghost" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn ghost" href="mailto:${encodeURIComponent(c.email || '')}?subject=${encodeURIComponent('Seu acesso de colunista - ' + S.config.nomePortal)}&body=${encodeURIComponent(msg)}">E-mail</a><a class="btn ghost" href="${esc(link)}" target="_blank" rel="noopener">Abrir editor ${ic('ext', 13)}</a></div>
    <div class="demo-hint" style="margin-top:16px"><b>Guarde este link agora.</b> Por segurança, o portal não armazena o link, só uma versão embaralhada dele. Se ele se perder, clique em <b>Novo link</b> na lista: o link anterior deixa de funcionar.</div>`);
  $('#lc-cp', el).onclick = () => copiar(link); $('#lc', el).onclick = e => e.target.select();
}
function formColunista(c = {}, onSalvo) {
  const novo = !c.id;
  const { el, close } = modal(novo ? 'Novo colunista' : 'Editar colunista', `<form class="form" id="fcl">

    <div class="row2"><label>Titulação ou cargo<input name="titulacao" maxlength="120" value="${esc(c.titulacao || '')}" placeholder="Ex.: Doutora em Direito Civil"></label>

    <datalist id="dl-disc-c">${DISCIPLINAS.map(d => `<option>${d}</option>`).join('')}</datalist>`, { wide: true });

      const o = { ...c, nome: f.nome.value.trim(), email: f.email.value.trim().toLowerCase(), titulacao: f.titulacao.value.trim(), instituicao: f.instituicao.value.trim(), disciplina: f.disciplina.value.trim(), bio: f.bio.value.trim(), foto, ativo: c.ativo !== false, ocultos: c.ocultos || [] };
      let chave = null;
      if (novo) { chave = novaChaveColunista(); o.tokenHash = await hashChaveCol(chave); o.linkEm = Date.now(); }
      const salvo = await store.save('colunistas', o);
      close(); toast(novo ? 'Colunista cadastrado.' : 'Dados salvos.');
      if (chave) mostrarLinkColunista(salvo, chave);
      onSalvo?.();
    } catch (er) { toast(er.message, true); b.disabled = false; b.textContent = novo ? 'Cadastrar e gerar link' : 'Salvar'; }
  };
}
async function admColunistas(box, ag) {
  box.innerHTML = '<div class="loading">Carregando colunistas…</div>';
  const [cols, colunas] = await Promise.all([store.list('colunistas'), store.list('colunas').catch(() => [])]);
  const porId = new Map(colunas.map(c => [c.id, c]));
  const leit = id => ag.cols?.[id] || 0;
  cols.sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  const resumo = c => {
    const arts = porId.get(c.id)?.artigos || [], pub = arts.filter(a => a.publicado);
    const ult = Math.max(0, ...arts.map(a => a.atualizadoEm || 0));
    return { pub: pub.length, ocultos: pub.filter(a => (c.ocultos || []).includes(a.id)).length, rasc: arts.filter(a => !a.publicado).length, leituras: pub.reduce((s, a) => s + leit(a.id), 0), ult };
  };
  const totPub = cols.reduce((s, c) => s + resumo(c).pub, 0), totLeit = cols.reduce((s, c) => s + resumo(c).leituras, 0);
  const recarregar = () => go('admin/colunistas');
  box.innerHTML = `<div class="list-h"><p class="muted" style="margin:0;max-width:70ch">Cada professor recebe um <b>link pessoal</b> para escrever online, sem criar conta. O texto é salvo sozinho enquanto ele escreve e, ao clicar em <b>Salvar e publicar no painel</b>, aparece para os alunos no <a href="#/academico">Painel colaborativo acadêmico</a>.</p>
      <button class="btn primary sm" id="novo">${ic('plus', 15)} Novo colunista</button></div>
    <div class="stats" style="margin-top:18px"><div class="stat"><span class="si">${ic('users', 20)}</span><div><div class="n">${cols.filter(c => c.ativo !== false).length}</div><div class="l">Colunistas ativos</div></div></div>
      <div class="stat"><span class="si">${ic('pen', 20)}</span><div><div class="n">${totPub}</div><div class="l">Artigos publicados</div></div></div>
      <div class="stat"><span class="si">${ic('eye', 20)}</span><div><div class="n">${fmtN(totLeit)}</div><div class="l">Leituras dos alunos</div></div></div>
      <div class="stat"><span class="si">${ic('clock', 20)}</span><div><div class="n" style="font-size:1.15rem">${(() => { const u = Math.max(0, ...cols.map(c => resumo(c).ult)); return u ? fmtDate(u) : '—'; })()}</div><div class="l">Última escrita</div></div></div></div>
    ${cols.length ? `<div class="card table-wrap"><table><tr><th>Colunista</th><th>Artigos</th><th>Leituras</th><th>Última escrita</th><th>Acesso</th><th></th></tr>
      ${cols.map(c => { const r = resumo(c), p = perfilColunista(c, porId.get(c.id)); return `<tr><td><div class="col-tab-nm">${avatarCol(p, 38)}<div><b>${esc(c.nome)}</b><div class="small muted">${esc([p.titulacao, c.email].filter(Boolean).join(' · ') || '—')}</div></div></div></td>
        <td><b>${r.pub}</b> publicado${r.pub === 1 ? '' : 's'}${r.ocultos ? ` <span class="badge warn">${r.ocultos} oculto${r.ocultos === 1 ? '' : 's'}</span>` : ''}<div class="small muted">${r.rasc} rascunho${r.rasc === 1 ? '' : 's'}</div></td>
        <td>${fmtN(r.leituras)}</td><td>${r.ult ? fmtDate(r.ult) : '<span class="muted">Ainda não escreveu</span>'}</td>
        <td>${c.ativo === false ? '<span class="badge err">Pausado</span>' : '<span class="badge ok">Ativo</span>'}</td>
        <td><div class="acts"><button class="btn primary sm" data-act="link" data-id="${esc(c.id)}">${ic('link', 14)} Novo link</button><button class="btn ghost sm" data-act="arts" data-id="${esc(c.id)}">Artigos</button><button class="btn ghost sm" data-act="ed" data-id="${esc(c.id)}">${ic('edit', 14)}</button>
          <button class="btn ghost sm" data-act="ativo" data-id="${esc(c.id)}">${c.ativo === false ? 'Reativar' : 'Pausar'}</button><button class="btn danger sm" data-act="del" data-id="${esc(c.id)}" title="Excluir">${ic('trash', 14)}</button></div></td></tr>`; }).join('')}</table></div>`
      : `<div class="card empty">${ART.medal('pen')}<h3>Nenhum colunista ainda</h3><p>Cadastre o primeiro professor e envie o link para ele começar a escrever.</p><button class="btn primary" id="novo2">${ic('plus', 15)} Novo colunista</button></div>`}`;
  $('#novo').onclick = () => formColunista({}, recarregar);
  const n2 = $('#novo2'); if (n2) n2.onclick = () => formColunista({}, recarregar);
  box.onclick = async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const c = cols.find(x => x.id === b.dataset.id); if (!c) return;
    const act = b.dataset.act;
    try {
      if (act === 'ed') return formColunista(c, recarregar);
      if (act === 'link') {
        if (c.tokenHash && !await confirmar(`Gerar um novo link para ${c.nome}? O link enviado antes deixa de funcionar.`, 'Gerar novo link')) return;
        const chave = novaChaveColunista(); await store.save('colunistas', { ...c, tokenHash: await hashChaveCol(chave), linkEm: Date.now(), ativo: true });
        mostrarLinkColunista(c, chave); return admColunistas(box, ag);

        await store.save('colunistas', { ...c, ativo: !pausar }); toast(pausar ? 'Acesso pausado.' : 'Acesso reativado.'); return admColunistas(box, ag);

        await store.remove('colunistas', c.id); await store.remove('colunas', c.id); toast('Colunista excluído.'); return admColunistas(box, ag);
      }
      if (act === 'arts') {
        const coluna = (await store.get('colunas', c.id).catch(() => null)) || porId.get(c.id), p = perfilColunista(c, coluna), arts = (coluna?.artigos || []).filter(a => a.publicado);
        const { el } = modal(`Artigos de ${c.nome}`, arts.length ? `<p class="small muted" style="margin-top:0">Só o professor edita os textos. Aqui você pode ocultar um artigo do painel sem apagá-lo.</p><div class="card table-wrap"><table><tr><th>Artigo</th><th>Publicado</th><th>Leituras</th><th></th></tr>
          ${arts.map(a => { const oc = (c.ocultos || []).includes(a.id); return `<tr><td><b>${esc(a.publicado.titulo)}</b><div class="small muted">${esc(a.publicado.disciplina || '')}${oc ? ' · <span class="badge warn">Oculto</span>' : ''}</div></td><td>${fmtDate(a.publicado.publicadoEm)}</td><td>${fmtN(leit(a.id))}</td>
            <td><div class="acts"><button class="btn ghost sm" data-ver="${esc(a.id)}">${ic('eye', 14)} Ler</button><button class="btn ${oc ? 'primary' : 'ghost'} sm" data-oc="${esc(a.id)}">${oc ? 'Mostrar no painel' : 'Ocultar'}</button></div></td></tr>`; }).join('')}</table></div>`
          : `<div class="empty"><p>${esc(c.nome)} ainda não publicou artigos${(coluna?.artigos || []).length ? ` (há ${(coluna.artigos || []).length} rascunho(s) em andamento)` : ''}.</p></div>`, { wide: true });
        el.addEventListener('click', async ev => {
          const v = ev.target.closest('[data-ver]'), o = ev.target.closest('[data-oc]');
          if (v) { const a = arts.find(x => x.id === v.dataset.ver); modal(a.publicado.titulo, `<div class="doc col-folha">${artigoHTML(a.publicado, p)}</div>`, { wide: true }); }
          if (o) {
            const id = o.dataset.oc, oc = c.ocultos || [];
            c.ocultos = oc.includes(id) ? oc.filter(x => x !== id) : [...oc, id];
            o.disabled = true;
            try { await store.save('colunistas', c); el.remove(); toast(c.ocultos.includes(id) ? 'Artigo ocultado do painel.' : 'Artigo de volta ao painel.'); admColunistas(box, ag); } catch (er) { toast(er.message, true); o.disabled = false; }
          }
        });
      }
    } catch (er) { toast(er.message, true); }
  };
}

(async function boot() {
  try {
    store = CONFIG.backend === 'firebase' ? await FirebaseStore() : CONFIG.backend === 'gist' ? GistStore() : LocalStore();
    await store.init();
    S.config = await store.getConfig();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="auth"><div class="card"><h2>Não foi possível iniciar</h2><p class="muted">${esc(e.message)}</p><p class="small">${CONFIG.backend === 'firebase' ? 'Verifique as credenciais do Firebase em CONFIG.' : 'Seu navegador precisa permitir IndexedDB (desative a navegação anônima restrita).'}</p></div></div>`;
    return;
  }
  if (isStandalone()) document.documentElement.classList.add('standalone');
  fixarLinkGist();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    try { navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e)); } catch (e) { console.warn(e); }
  }
  window.addEventListener('hashchange', () => { document.querySelectorAll('.modal-bg').forEach(m => m.remove()); render(); });
  let wasMobile = isMobile();
  window.addEventListener('resize', () => { if (isMobile() !== wasMobile) { wasMobile = isMobile(); render(); } });
  render();
})();
</script>
</body>
</html>
